<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAINTLOG — ระบบบันทึกการซ่อมบำรุง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Recharts + deps -->
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<!-- Babel (in-browser JSX transform) -->
<script crossorigin src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
  :root {
    --bg:#1B1E21; --surface:#22262A; --surface-alt:#2A2F34;
    --border:#383D42; --hi:#ECE8E1; --lo:#949BA1;
    --amber:#E3A542; --teal:#5B9279; --red:#C4574E; --blue:#5C8AA6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'IBM Plex Sans', sans-serif; color: var(--hi); }
  #root { min-height: 100vh; }

  .app { background: var(--bg); color: var(--hi); min-height: 100vh; display: flex; font-size: 14px; }
  .headline { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 0.01em; }

  .sidebar { width: 208px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
  .brand { padding: 0 8px 20px 8px; }
  .brand-mark { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand-dot { width: 9px; height: 9px; background: var(--amber); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
  .brand-title { font-family:'Barlow Condensed'; font-weight:700; font-size: 19px; line-height:1; }
  .brand-sub { color: var(--lo); font-size: 11px; margin-top: 3px; }
  .nav-item { display:flex; align-items:center; gap: 10px; padding: 10px 10px; border-radius: 3px; color: var(--lo); cursor: pointer; border: 1px solid transparent; font-size: 13.5px; user-select:none; }
  .nav-item:hover { color: var(--hi); background: var(--surface-alt); }
  .nav-item.active { color: var(--hi); background: var(--surface-alt); border-color: var(--border); }
  .nav-item.active .nav-ico { background: var(--amber); }
  .nav-ico { width: 5px; height: 5px; background: var(--border); flex-shrink:0; }
  .nav-count { margin-left:auto; font-family:'IBM Plex Mono'; font-size: 10.5px; color: var(--lo); background: var(--bg); padding: 1px 6px; border: 1px solid var(--border); }
  .sidebar-foot { margin-top: auto; padding: 10px 8px 0 8px; border-top: 1px solid var(--border); color: var(--lo); font-size: 11px; line-height: 1.6;}

  .main { flex: 1; padding: 28px 34px 60px; max-width: 1180px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
  .page-title { font-family:'Barlow Condensed'; font-weight: 700; font-size: 26px; }
  .page-desc { color: var(--lo); font-size: 12.5px; margin-top: 3px; }
  .btn { font-family:'IBM Plex Sans'; font-weight: 500; font-size: 13px; padding: 9px 16px; background: var(--amber); color: #1B1E21; border: none; cursor: pointer; border-radius: 2px; }
  .btn:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--hi); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--lo); }

  .bracket { position: relative; background: var(--surface); border: 1px solid var(--border); padding: 16px 18px; }
  .bk { position: absolute; width: 9px; height: 9px; border-color: var(--amber); }
  .bk-tl { top: -1px; left: -1px; border-top: 2px solid var(--amber); border-left: 2px solid var(--amber); }
  .bk-tr { top: -1px; right: -1px; border-top: 2px solid var(--amber); border-right: 2px solid var(--amber); }
  .bk-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--amber); border-left: 2px solid var(--amber); }
  .bk-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--amber); border-right: 2px solid var(--amber); }

  .kpi-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi-label { color: var(--lo); font-size: 11px; margin-bottom: 8px; }
  .kpi-value { font-family:'Barlow Condensed'; font-weight: 700; font-size: 28px; line-height:1; }
  .kpi-sub { color: var(--lo); font-size: 11px; margin-top: 6px; }

  .panel { background: var(--surface); border: 1px solid var(--border); padding: 18px 20px; margin-bottom: 16px; }
  .panel-title { font-family:'Barlow Condensed'; font-weight: 600; font-size: 16px; margin-bottom: 2px; }
  .panel-sub { color: var(--lo); font-size: 11.5px; margin-bottom: 14px; }
  .chart-row { display:grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .chart-row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .tag { font-size: 10.5px; padding: 2px 8px; border: 1px solid; border-radius: 2px; white-space:nowrap; }

  .toolbar { display:flex; gap: 10px; margin-bottom: 14px; align-items:center; flex-wrap: wrap; }
  .input, select.input { background: var(--surface); border: 1px solid var(--border); color: var(--hi); padding: 9px 11px; font-size: 13px; font-family:'IBM Plex Sans'; border-radius: 2px; }
  .input:focus, select.input:focus { outline: none; border-color: var(--amber); }
  .search { flex: 1; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; color: var(--lo); font-weight: 500; font-size: 10.5px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tbody td { padding: 11px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tbody tr:hover { background: var(--surface-alt); }
  .equip-name { font-weight: 500; }
  .equip-note { color: var(--lo); font-size: 11.5px; margin-top: 2px; max-width: 260px; }
  .row-actions { display:flex; gap: 6px; }
  .icon-btn { background: none; border: 1px solid var(--border); color: var(--lo); font-size: 11px; padding: 4px 9px; cursor:pointer; border-radius: 2px; }
  .icon-btn:hover { color: var(--hi); border-color: var(--lo); }
  .mono { font-family: 'IBM Plex Mono'; font-size: 12px; }

  .empty { text-align:center; padding: 50px 20px; color: var(--lo); }
  .empty .headline { font-size: 18px; color: var(--hi); margin-bottom: 6px; }

  .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field { display:flex; flex-direction:column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; color: var(--lo); }
  textarea.input { resize: vertical; min-height: 72px; font-family:'IBM Plex Sans'; }
  .form-actions { display:flex; gap: 10px; margin-top: 18px; justify-content:flex-end; }

  .toast { position: fixed; bottom: 24px; right: 28px; background: var(--surface-alt); border: 1px solid var(--border); border-left: 3px solid var(--teal); padding: 12px 18px; font-size: 13px; z-index: 50; }
  .toast.err { border-left-color: var(--red); }
  .loading-wrap { display:flex; align-items:center; justify-content:center; height: 60vh; width:100%; color: var(--lo); }

  @media (max-width: 880px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; border-right:none; border-bottom:1px solid var(--border); }
    .sidebar-foot { display:none; }
    .brand { display:none; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-row, .chart-row2 { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .main { padding: 18px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const {
  LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend
} = Recharts;

const COLORS = {
  bg: "#1B1E21", surface: "#22262A", surfaceAlt: "#2A2F34",
  border: "#383D42", hi: "#ECE8E1", lo: "#949BA1",
  amber: "#E3A542", teal: "#5B9279", red: "#C4574E", blue: "#5C8AA6",
};

const TYPE_META = {
  preventive: { label: "ป้องกัน", color: COLORS.teal },
  corrective: { label: "แก้ไข", color: COLORS.blue },
  emergency: { label: "ฉุกเฉิน", color: COLORS.red },
};
const STATUS_META = {
  completed: { label: "เสร็จสิ้น", color: COLORS.teal },
  pending: { label: "รอดำเนินการ", color: COLORS.amber },
  overdue: { label: "เกินกำหนด", color: COLORS.red },
};
const PRIORITY_META = {
  low: { label: "ต่ำ", color: COLORS.lo },
  medium: { label: "ปานกลาง", color: COLORS.amber },
  high: { label: "สูง", color: COLORS.red },
};

const STORAGE_KEY = "maintlog_records_v1";
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtTHB = (n) => new Intl.NumberFormat("th-TH", { style: "currency", currency: "THB", maximumFractionDigits: 0 }).format(n || 0);
const fmtMonth = (iso) => new Date(iso).toLocaleDateString("th-TH", { month: "short", year: "2-digit" });

const SEED = [
  { id: uid(), equipment: "คอมเพรสเซอร์ #1", type: "preventive", date: "2026-06-12", technician: "สมชาย ใจดี", cost: 3500, downtime: 1.5, priority: "low", status: "completed", note: "เปลี่ยนไส้กรองอากาศ ตรวจแรงดัน" },
  { id: uid(), equipment: "สายพานลำเลียง A", type: "corrective", date: "2026-06-20", technician: "วิชัย พรหมมา", cost: 8200, downtime: 4, priority: "medium", status: "completed", note: "เปลี่ยนลูกปืนที่ชำรุด" },
  { id: uid(), equipment: "หม้อแปลงไฟฟ้า", type: "emergency", date: "2026-07-02", technician: "ประยุทธ ศรีสุข", cost: 22000, downtime: 9, priority: "high", status: "completed", note: "ฉนวนไหม้ ต้องเปลี่ยนชุดขดลวด" },
  { id: uid(), equipment: "เครื่อง CNC #2", type: "preventive", date: "2026-07-10", technician: "สมชาย ใจดี", cost: 1800, downtime: 1, priority: "low", status: "completed", note: "หล่อลื่นราง ตรวจสอบความแม่นยำ" },
  { id: uid(), equipment: "ปั๊มน้ำหล่อเย็น", type: "corrective", date: "2026-07-18", technician: "อนุชา ทองดี", cost: 5400, downtime: 3, priority: "medium", status: "pending", note: "รอ seal ใหม่จากซัพพลายเออร์" },
  { id: uid(), equipment: "คอมเพรสเซอร์ #1", type: "preventive", date: "2026-08-01", technician: "วิชัย พรหมมา", cost: 3600, downtime: 1.5, priority: "low", status: "completed", note: "รอบตรวจประจำเดือน" },
  { id: uid(), equipment: "สายพานลำเลียง B", type: "emergency", date: "2026-08-14", technician: "ประยุทธ ศรีสุข", cost: 14500, downtime: 6, priority: "high", status: "overdue", note: "มอเตอร์ไหม้ ต้องสั่งอะไหล่ด่วน" },
  { id: uid(), equipment: "เครื่อง CNC #1", type: "corrective", date: "2026-08-20", technician: "สมชาย ใจดี", cost: 6700, downtime: 2.5, priority: "medium", status: "completed", note: "ปรับตั้งแกน spindle" },
];

function Bracket({ children, className = "" }) {
  return (
    <div className={`bracket ${className}`}>
      <span className="bk bk-tl" /><span className="bk bk-tr" />
      <span className="bk bk-bl" /><span className="bk bk-br" />
      {children}
    </div>
  );
}
function Tag({ meta }) {
  return <span className="tag" style={{ color: meta.color, borderColor: meta.color + "55", background: meta.color + "14" }}>{meta.label}</span>;
}
function KPI({ label, value, sub, accent }) {
  return (
    <Bracket className="kpi">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value" style={accent ? { color: accent } : undefined}>{value}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
    </Bracket>
  );
}

function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SEED;
}
function saveRecords(records) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (e) {
    return false;
  }
}

function App() {
  const [records, setRecords] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [query, setQuery] = useState("");
  const [filterType, setFilterType] = useState("all");
  const [filterStatus, setFilterStatus] = useState("all");
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => { setRecords(loadRecords()); }, []);

  const showToast = (msg, isError = false) => {
    setToast({ msg, isError });
    setTimeout(() => setToast(null), 2600);
  };

  const persist = useCallback((next) => {
    setRecords(next);
    const ok = saveRecords(next);
    if (!ok) showToast("บันทึกไม่สำเร็จ พื้นที่จัดเก็บอาจเต็ม", true);
  }, []);

  const saveRecord = (rec) => {
    if (!records) return;
    let next;
    if (rec.id && records.some((r) => r.id === rec.id)) {
      next = records.map((r) => (r.id === rec.id ? rec : r));
      showToast("แก้ไขรายการเรียบร้อย");
    } else {
      next = [{ ...rec, id: uid() }, ...records];
      showToast("บันทึกรายการใหม่แล้ว");
    }
    persist(next);
    setEditing(null);
    setTab("records");
  };

  const deleteRecord = (id) => {
    if (!records) return;
    persist(records.filter((r) => r.id !== id));
    showToast("ลบรายการแล้ว");
  };

  const filtered = useMemo(() => {
    if (!records) return [];
    return records
      .filter((r) => (filterType === "all" ? true : r.type === filterType))
      .filter((r) => (filterStatus === "all" ? true : r.status === filterStatus))
      .filter((r) => {
        if (!query.trim()) return true;
        const q = query.toLowerCase();
        return r.equipment.toLowerCase().includes(q) || r.technician.toLowerCase().includes(q) || (r.note || "").toLowerCase().includes(q);
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [records, query, filterType, filterStatus]);

  const stats = useMemo(() => {
    if (!records || records.length === 0) return null;
    const totalCost = records.reduce((s, r) => s + Number(r.cost || 0), 0);
    const totalDowntime = records.reduce((s, r) => s + Number(r.downtime || 0), 0);
    const overdue = records.filter((r) => r.status === "overdue").length;
    const emergency = records.filter((r) => r.type === "emergency").length;

    const byMonth = {};
    records.forEach((r) => {
      const key = r.date.slice(0, 7);
      byMonth[key] = byMonth[key] || { month: key, cost: 0, count: 0 };
      byMonth[key].cost += Number(r.cost || 0);
      byMonth[key].count += 1;
    });
    const trend = Object.values(byMonth).sort((a, b) => (a.month > b.month ? 1 : -1)).map((d) => ({ ...d, label: fmtMonth(d.month + "-01") }));

    const byType = Object.keys(TYPE_META).map((t) => ({
      name: TYPE_META[t].label, value: records.filter((r) => r.type === t).length, color: TYPE_META[t].color,
    })).filter((d) => d.value > 0);

    const byEquipMap = {};
    records.forEach((r) => {
      byEquipMap[r.equipment] = byEquipMap[r.equipment] || { equipment: r.equipment, cost: 0, downtime: 0, count: 0 };
      byEquipMap[r.equipment].cost += Number(r.cost || 0);
      byEquipMap[r.equipment].downtime += Number(r.downtime || 0);
      byEquipMap[r.equipment].count += 1;
    });
    const byEquip = Object.values(byEquipMap).sort((a, b) => b.cost - a.cost).slice(0, 8);

    const byStatus = Object.keys(STATUS_META).map((s) => ({
      name: STATUS_META[s].label, value: records.filter((r) => r.status === s).length, color: STATUS_META[s].color,
    })).filter((d) => d.value > 0);

    return { totalCost, totalDowntime, overdue, emergency, trend, byType, byEquip, byStatus, count: records.length };
  }, [records]);

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><span className="brand-dot" /><span className="brand-title">MAINTLOG</span></div>
          <div className="brand-sub">ระบบบันทึกการซ่อมบำรุง</div>
        </div>
        {[["dashboard", "ภาพรวมและวิเคราะห์ข้อมูล"], ["records", "รายการซ่อมบำรุง"], ["new", "บันทึกรายการใหม่"]].map(([key, label]) => (
          <div key={key} className={`nav-item ${tab === key ? "active" : ""}`}
               onClick={() => { setTab(key); if (key === "new") setEditing({}); }}>
            <span className="nav-ico" />
            <span>{label}</span>
            {key !== "new" && <span className="nav-count">{records ? records.length : "–"}</span>}
          </div>
        ))}
        <div className="sidebar-foot">ข้อมูลจัดเก็บในเบราว์เซอร์นี้เท่านั้น<br />(localStorage ของเครื่อง)</div>
      </aside>

      <main className="main">
        {!records ? (
          <div className="loading-wrap">กำลังโหลดข้อมูล…</div>
        ) : tab === "dashboard" ? (
          <Dashboard stats={stats} onNew={() => { setEditing({}); setTab("new"); }} />
        ) : tab === "records" ? (
          <Records
            filtered={filtered} query={query} setQuery={setQuery}
            filterType={filterType} setFilterType={setFilterType}
            filterStatus={filterStatus} setFilterStatus={setFilterStatus}
            onEdit={(r) => { setEditing(r); setTab("new"); }}
            onDelete={deleteRecord}
            onNew={() => { setEditing({}); setTab("new"); }}
            total={records.length}
          />
        ) : (
          <RecordForm initial={editing} onCancel={() => setTab("records")} onSave={saveRecord} />
        )}
      </main>

      {toast && <div className={`toast ${toast.isError ? "err" : ""}`}>{toast.msg}</div>}
    </div>
  );
}

function Dashboard({ stats, onNew }) {
  if (!stats) {
    return (
      <div className="empty">
        <div className="headline">ยังไม่มีข้อมูล</div>
        <div style={{ marginBottom: 16 }}>เริ่มบันทึกรายการซ่อมบำรุงเพื่อดูการวิเคราะห์ข้อมูล</div>
        <button className="btn" onClick={onNew}>+ บันทึกรายการแรก</button>
      </div>
    );
  }
  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">ภาพรวมและวิเคราะห์ข้อมูล</div>
          <div className="page-desc">สรุปสถานะการซ่อมบำรุงทั้งหมด {stats.count} รายการ</div>
        </div>
        <button className="btn" onClick={onNew}>+ บันทึกรายการใหม่</button>
      </div>

      <div className="kpi-grid">
        <KPI label="ค่าใช้จ่ายรวม" value={fmtTHB(stats.totalCost)} sub={`${stats.count} รายการ`} />
        <KPI label="เวลาหยุดเครื่องรวม" value={`${stats.totalDowntime.toFixed(1)} ชม.`} sub="ทุกอุปกรณ์" />
        <KPI label="งานเกินกำหนด" value={stats.overdue} accent={stats.overdue > 0 ? COLORS.red : undefined} sub="ต้องติดตามด่วน" />
        <KPI label="ซ่อมฉุกเฉิน" value={stats.emergency} accent={stats.emergency > 0 ? COLORS.amber : undefined} sub="ไม่ได้วางแผนล่วงหน้า" />
      </div>

      <div className="chart-row">
        <div className="panel">
          <div className="panel-title">แนวโน้มค่าใช้จ่ายรายเดือน</div>
          <div className="panel-sub">ยอดค่าซ่อมบำรุงตามช่วงเวลา</div>
          <ResponsiveContainer width="100%" height={230}>
            <LineChart data={stats.trend} margin={{ left: -12, right: 8 }}>
              <CartesianGrid stroke={COLORS.border} vertical={false} />
              <XAxis dataKey="label" tick={{ fill: COLORS.lo, fontSize: 11 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
              <YAxis tick={{ fill: COLORS.lo, fontSize: 11 }} axisLine={false} tickLine={false} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} />
              <Tooltip contentStyle={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, fontSize: 12, borderRadius: 2 }} labelStyle={{ color: COLORS.hi }} formatter={(v) => [fmtTHB(v), "ค่าใช้จ่าย"]} />
              <Line type="monotone" dataKey="cost" stroke={COLORS.amber} strokeWidth={2} dot={{ r: 3, fill: COLORS.amber }} />
            </LineChart>
          </ResponsiveContainer>
        </div>

        <div className="panel">
          <div className="panel-title">ประเภทงานซ่อม</div>
          <div className="panel-sub">สัดส่วนตามประเภท</div>
          <ResponsiveContainer width="100%" height={230}>
            <PieChart>
              <Pie data={stats.byType} dataKey="value" nameKey="name" innerRadius={52} outerRadius={78} paddingAngle={2} stroke="none">
                {stats.byType.map((d, i) => <Cell key={i} fill={d.color} />)}
              </Pie>
              <Tooltip contentStyle={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, fontSize: 12, borderRadius: 2 }} />
              <Legend verticalAlign="bottom" height={30} formatter={(val) => <span style={{ color: COLORS.lo, fontSize: 11.5 }}>{val}</span>} />
            </PieChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="chart-row2">
        <div className="panel">
          <div className="panel-title">ค่าใช้จ่ายตามอุปกรณ์</div>
          <div className="panel-sub">อุปกรณ์ที่มีค่าซ่อมบำรุงสูงสุด</div>
          <ResponsiveContainer width="100%" height={Math.max(200, stats.byEquip.length * 34)}>
            <BarChart data={stats.byEquip} layout="vertical" margin={{ left: 8, right: 20 }}>
              <CartesianGrid stroke={COLORS.border} horizontal={false} />
              <XAxis type="number" tick={{ fill: COLORS.lo, fontSize: 11 }} axisLine={false} tickLine={false} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} />
              <YAxis type="category" dataKey="equipment" tick={{ fill: COLORS.hi, fontSize: 11.5 }} axisLine={false} tickLine={false} width={120} />
              <Tooltip contentStyle={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, fontSize: 12, borderRadius: 2 }} formatter={(v) => [fmtTHB(v), "ค่าใช้จ่าย"]} cursor={{ fill: COLORS.surfaceAlt }} />
              <Bar dataKey="cost" fill={COLORS.blue} radius={[0, 2, 2, 0]} barSize={14} />
            </BarChart>
          </ResponsiveContainer>
        </div>

        <div className="panel">
          <div className="panel-title">สถานะงานซ่อมบำรุง</div>
          <div className="panel-sub">จำนวนรายการตามสถานะปัจจุบัน</div>
          <ResponsiveContainer width="100%" height={230}>
            <BarChart data={stats.byStatus} margin={{ left: -12, right: 8 }}>
              <CartesianGrid stroke={COLORS.border} vertical={false} />
              <XAxis dataKey="name" tick={{ fill: COLORS.lo, fontSize: 11.5 }} axisLine={{ stroke: COLORS.border }} tickLine={false} />
              <YAxis tick={{ fill: COLORS.lo, fontSize: 11 }} axisLine={false} tickLine={false} allowDecimals={false} />
              <Tooltip contentStyle={{ background: COLORS.surfaceAlt, border: `1px solid ${COLORS.border}`, fontSize: 12, borderRadius: 2 }} cursor={{ fill: COLORS.surfaceAlt }} />
              <Bar dataKey="value" radius={[2, 2, 0, 0]} barSize={38}>
                {stats.byStatus.map((d, i) => <Cell key={i} fill={d.color} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    </div>
  );
}

function Records({ filtered, query, setQuery, filterType, setFilterType, filterStatus, setFilterStatus, onEdit, onDelete, onNew, total }) {
  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">รายการซ่อมบำรุง</div>
          <div className="page-desc">ทั้งหมด {total} รายการ · แสดง {filtered.length} รายการ</div>
        </div>
        <button className="btn" onClick={onNew}>+ บันทึกรายการใหม่</button>
      </div>

      <div className="toolbar">
        <input className="input search" placeholder="ค้นหาอุปกรณ์, ช่าง, รายละเอียด…" value={query} onChange={(e) => setQuery(e.target.value)} />
        <select className="input" value={filterType} onChange={(e) => setFilterType(e.target.value)}>
          <option value="all">ทุกประเภท</option>
          {Object.entries(TYPE_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <select className="input" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
          <option value="all">ทุกสถานะ</option>
          {Object.entries(STATUS_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
      </div>

      {filtered.length === 0 ? (
        <div className="empty">
          <div className="headline">ไม่พบรายการ</div>
          <div>ลองปรับคำค้นหาหรือตัวกรองใหม่</div>
        </div>
      ) : (
        <div className="panel" style={{ padding: 0, overflowX: "auto" }}>
          <table>
            <thead>
              <tr>
                <th>อุปกรณ์</th><th>ประเภท</th><th>วันที่</th><th>ช่างซ่อม</th>
                <th>ค่าใช้จ่าย</th><th>หยุดเครื่อง</th><th>ความสำคัญ</th><th>สถานะ</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((r) => (
                <tr key={r.id}>
                  <td>
                    <div className="equip-name">{r.equipment}</div>
                    {r.note && <div className="equip-note">{r.note}</div>}
                  </td>
                  <td><Tag meta={TYPE_META[r.type]} /></td>
                  <td className="mono">{r.date}</td>
                  <td>{r.technician}</td>
                  <td className="mono">{fmtTHB(r.cost)}</td>
                  <td className="mono">{Number(r.downtime).toFixed(1)} ชม.</td>
                  <td><Tag meta={PRIORITY_META[r.priority]} /></td>
                  <td><Tag meta={STATUS_META[r.status]} /></td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" onClick={() => onEdit(r)}>แก้ไข</button>
                      <button className="icon-btn" onClick={() => onDelete(r.id)}>ลบ</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function RecordForm({ initial, onCancel, onSave }) {
  const isEdit = !!(initial && initial.id);
  const [form, setForm] = useState(() => ({
    id: initial && initial.id || null,
    equipment: (initial && initial.equipment) || "",
    type: (initial && initial.type) || "preventive",
    date: (initial && initial.date) || todayISO(),
    technician: (initial && initial.technician) || "",
    cost: initial && initial.cost !== undefined ? initial.cost : "",
    downtime: initial && initial.downtime !== undefined ? initial.downtime : "",
    priority: (initial && initial.priority) || "medium",
    status: (initial && initial.status) || "completed",
    note: (initial && initial.note) || "",
  }));
  const [error, setError] = useState("");

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.equipment.trim() || !form.technician.trim() || !form.date) {
      setError("กรุณากรอกชื่ออุปกรณ์ ช่างซ่อม และวันที่ให้ครบถ้วน");
      return;
    }
    onSave({ ...form, cost: Number(form.cost) || 0, downtime: Number(form.downtime) || 0 });
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">{isEdit ? "แก้ไขรายการซ่อมบำรุง" : "บันทึกรายการใหม่"}</div>
          <div className="page-desc">กรอกรายละเอียดงานซ่อมบำรุงให้ครบถ้วนเพื่อให้ข้อมูลวิเคราะห์แม่นยำ</div>
        </div>
      </div>

      <form className="panel" onSubmit={submit}>
        <div className="form-grid">
          <div className="field full">
            <label>ชื่ออุปกรณ์ / เครื่องจักร</label>
            <input className="input" value={form.equipment} onChange={(e) => set("equipment", e.target.value)} placeholder="เช่น คอมเพรสเซอร์ #1" />
          </div>

          <div className="field">
            <label>ประเภทงาน</label>
            <select className="input" value={form.type} onChange={(e) => set("type", e.target.value)}>
              {Object.entries(TYPE_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div className="field">
            <label>วันที่ดำเนินการ</label>
            <input className="input" type="date" value={form.date} onChange={(e) => set("date", e.target.value)} />
          </div>

          <div className="field">
            <label>ช่างผู้รับผิดชอบ</label>
            <input className="input" value={form.technician} onChange={(e) => set("technician", e.target.value)} placeholder="ชื่อช่างซ่อม" />
          </div>
          <div className="field">
            <label>ความสำคัญ</label>
            <select className="input" value={form.priority} onChange={(e) => set("priority", e.target.value)}>
              {Object.entries(PRIORITY_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>

          <div className="field">
            <label>ค่าใช้จ่าย (บาท)</label>
            <input className="input" type="number" min="0" step="1" value={form.cost} onChange={(e) => set("cost", e.target.value)} placeholder="0" />
          </div>
          <div className="field">
            <label>เวลาหยุดเครื่อง (ชั่วโมง)</label>
            <input className="input" type="number" min="0" step="0.5" value={form.downtime} onChange={(e) => set("downtime", e.target.value)} placeholder="0" />
          </div>

          <div className="field">
            <label>สถานะ</label>
            <select className="input" value={form.status} onChange={(e) => set("status", e.target.value)}>
              {Object.entries(STATUS_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div />

          <div className="field full">
            <label>รายละเอียด / บันทึกเพิ่มเติม</label>
            <textarea className="input" value={form.note} onChange={(e) => set("note", e.target.value)} placeholder="อาการ, อะไหล่ที่เปลี่ยน, หมายเหตุ…" />
          </div>
        </div>

        {error && <div style={{ color: COLORS.red, fontSize: 12.5, marginTop: 12 }}>{error}</div>}

        <div className="form-actions">
          <button type="button" className="btn btn-ghost" onClick={onCancel}>ยกเลิก</button>
          <button type="submit" className="btn">{isEdit ? "บันทึกการแก้ไข" : "บันทึกรายการ"}</button>
        </div>
      </form>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
