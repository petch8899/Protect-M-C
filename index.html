<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกการซ่อมบำรุงเครื่องจักร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c;
    --panel:#1b1f26;
    --panel-2:#20252d;
    --line:#2c323b;
    --ink:#e9e7e0;
    --muted:#8b93a0;
    --accent:#e2622c;
    --accent-dim:#7a3a20;
    --amber:#d9a441;
    --ok:#4caf7d;
    --warn:#e2492f;
    --paper:#f3f0e8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  ::selection{background:var(--accent);color:#fff;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* ---------- Auth screens ---------- */
  .auth-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
    position:relative;
    overflow:hidden;
  }
  .auth-wrap::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:.25;
    mask-image:radial-gradient(circle at 50% 40%, black, transparent 75%);
  }
  .auth-card{
    position:relative;
    z-index:2;
    width:min(92vw,420px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:2.4rem 2.2rem;
  }
  .auth-brand{
    display:flex;
    align-items:center;
    gap:.7rem;
    margin-bottom:1.8rem;
  }
  .gear-mark{
    width:34px;height:34px;flex:none;
    color:var(--accent);
  }
  .auth-brand .name{
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.02em;
  }
  .auth-brand .name small{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:.68rem;
    color:var(--muted);
    letter-spacing:.08em;
    margin-top:.15rem;
  }
  .auth-card h1{
    font-size:1.6rem;
    margin:0 0 .35rem;
    font-weight:600;
  }
  .auth-card p.lede{
    color:var(--muted);
    font-size:.88rem;
    margin:0 0 1.6rem;
    line-height:1.5;
  }
  .field{
    margin-bottom:1rem;
  }
  .field label{
    display:block;
    font-size:.76rem;
    color:var(--muted);
    margin-bottom:.4rem;
    letter-spacing:.02em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    padding:.68rem .8rem;
    font-size:.92rem;
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--accent);
  }
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.8rem;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    border:none;
    border-radius:8px;
    padding:.75rem 1.1rem;
    font-size:.9rem;
    font-weight:600;
    transition:filter .15s ease, background .15s ease;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--muted);}
  .btn-sm{padding:.45rem .8rem;font-size:.8rem;}
  .btn-danger{background:transparent;color:var(--warn);border:1px solid var(--warn);}
  .btn-danger:hover{background:var(--warn);color:#fff;}

  .switch-line{
    text-align:center;
    margin-top:1.4rem;
    font-size:.85rem;
    color:var(--muted);
  }
  .switch-line a{
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
  }
  .switch-line a:hover{text-decoration:underline;}
  .form-error{
    background:rgba(226,73,47,.12);
    border:1px solid var(--warn);
    color:#ff9a86;
    font-size:.82rem;
    padding:.6rem .8rem;
    border-radius:8px;
    margin-bottom:1rem;
  }
  .form-success{
    background:rgba(76,175,125,.12);
    border:1px solid var(--ok);
    color:#9be8c4;
    font-size:.82rem;
    padding:.6rem .8rem;
    border-radius:8px;
    margin-bottom:1rem;
  }

  /* ---------- App shell ---------- */
  .app-shell{
    display:grid;
    grid-template-columns:230px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:1.4rem 1.1rem;
  }
  .sb-brand{
    display:flex;
    align-items:center;
    gap:.6rem;
    padding:0 .3rem .5rem;
    margin-bottom:1.4rem;
  }
  .sb-brand .gear-mark{width:26px;height:26px;}
  .sb-brand .name{font-size:.82rem;font-weight:600;line-height:1.25;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:.65rem;
    padding:.65rem .8rem;
    border-radius:8px;
    font-size:.87rem;
    color:var(--muted);
    margin-bottom:.2rem;
    border:none;
    background:transparent;
    width:100%;
    text-align:left;
  }
  .nav-item svg{width:17px;height:17px;flex:none;}
  .nav-item:hover{color:var(--ink);background:var(--panel-2);}
  .nav-item.active{color:var(--ink);background:var(--panel-2);border-left:2px solid var(--accent);}
  .sb-spacer{flex:1;}
  .sb-user{
    border-top:1px solid var(--line);
    padding-top:1rem;
    margin-top:.6rem;
  }
  .sb-user .who{font-size:.82rem;font-weight:600;}
  .sb-user .role{font-size:.72rem;color:var(--muted);margin-top:.1rem;}
  .sb-user button{
    margin-top:.7rem;
    width:100%;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:8px;
    padding:.5rem;
    font-size:.78rem;
  }
  .sb-user button:hover{color:var(--ink);border-color:var(--muted);}

  .main{
    background:var(--paper);
    color:#1c2027;
    padding:2rem 2.4rem 3rem;
    overflow-x:hidden;
  }
  .main h1, .main h2{color:#1c2027;}
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:1.8rem;
    flex-wrap:wrap;
    gap:1rem;
  }
  .topbar h1{font-size:1.5rem;margin:0 0 .2rem;font-weight:600;}
  .topbar .sub{color:#77705f;font-size:.85rem;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:.7rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#9c8f6f;
    margin-bottom:.3rem;
  }

  /* dashboard cards */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1rem;
    margin-bottom:1.8rem;
  }
  .stat-card{
    background:#fff;
    border:1px solid #e3ddca;
    border-radius:12px;
    padding:1.1rem 1.2rem;
  }
  .stat-card .lbl{font-size:.76rem;color:#8a8267;margin-bottom:.4rem;}
  .stat-card .val{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:600;}
  .stat-card.warn .val{color:var(--warn);}
  .stat-card.amber .val{color:#b7841f;}
  .stat-card.ok .val{color:#2f7a53;}

  .line-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:1.1rem;
  }
  .line-card{
    background:#fff;
    border:1px solid #e3ddca;
    border-radius:12px;
    padding:1.2rem 1.3rem;
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .line-card:hover{
    border-color:var(--accent);
    box-shadow:0 6px 18px rgba(0,0,0,.07);
    transform:translateY(-1px);
  }
  .line-card-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;gap:.6rem;
  }
  .line-card-name{
    display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:1rem;color:#1c2027;
  }
  .line-card-name svg{width:18px;height:18px;color:var(--accent);flex:none;}
  .line-card-count{font-family:'JetBrains Mono',monospace;font-size:.76rem;color:#8a8267;flex:none;}
  .line-bar{
    height:6px;background:#efe9d8;border-radius:999px;overflow:hidden;margin-bottom:.9rem;
  }
  .line-bar-fill{height:100%;border-radius:999px;}
  .line-card-badges{display:flex;gap:.4rem;flex-wrap:wrap;}

  .dash-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:1.4rem;
    align-items:start;
  }
  .panel-card{
    background:#fff;
    border:1px solid #e3ddca;
    border-radius:12px;
    padding:1.3rem 1.4rem;
  }
  .panel-card h3{font-size:1rem;margin:0 0 1rem;font-weight:600;}

  .gauge-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .gauge-pct{
    font-family:'Space Grotesk',sans-serif;
    font-size:2.4rem;
    font-weight:700;
  }
  .gauge-label{font-size:.78rem;color:#8a8267;margin-top:.2rem;}
  .gauge-legend{
    display:flex;
    gap:1rem;
    margin-top:1.1rem;
    font-size:.75rem;
    color:#6e6754;
    flex-wrap:wrap;
    justify-content:center;
  }
  .gauge-legend span{display:flex;align-items:center;gap:.35rem;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th{
    text-align:left;
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#8a8267;
    padding:.5rem .6rem;
    border-bottom:1px solid #e3ddca;
  }
  td{
    padding:.65rem .6rem;
    border-bottom:1px solid #efe9d8;
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}
  tr.row-click{cursor:pointer;}
  tr.row-click:hover{background:#faf7ef;}

  .badge{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    font-size:.72rem;
    font-weight:600;
    padding:.28rem .6rem;
    border-radius:999px;
  }
  .badge .dot{width:6px;height:6px;}
  .badge-ok{background:#e4f4ea;color:#2f7a53;}
  .badge-duesoon{background:#fdf1dc;color:#a8721c;}
  .badge-overdue{background:#fbe6e2;color:#b3402a;}
  .badge-none{background:#eee9db;color:#7d765f;}

  .toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:1.1rem;
    gap:1rem;
    flex-wrap:wrap;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:.5rem;
    background:#fff;
    border:1px solid #e3ddca;
    border-radius:8px;
    padding:.5rem .8rem;
    min-width:240px;
  }
  .search-box input{
    border:none;outline:none;background:transparent;font-size:.85rem;width:100%;
  }
  .search-box svg{width:16px;height:16px;color:#9c8f6f;flex:none;}

  .empty-state{
    text-align:center;
    padding:3rem 1rem;
    color:#8a8267;
  }
  .empty-state .ico{width:40px;height:40px;margin:0 auto 1rem;color:#c7bfa3;}
  .empty-state h4{margin:0 0 .3rem;color:#4a4536;font-size:.98rem;}
  .empty-state p{margin:0 0 1.2rem;font-size:.85rem;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,23,28,.55);
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;z-index:50;
  }
  .modal{
    background:#fff;border-radius:14px;
    width:min(94vw,560px);
    max-height:88vh;
    overflow-y:auto;
    padding:1.7rem 1.8rem 1.9rem;
  }
  .modal h2{font-size:1.15rem;margin:0 0 1.2rem;font-weight:600;color:#1c2027;}
  .modal .field label{color:#8a8267;}
  .modal .field input, .modal .field select, .modal .field textarea{
    background:#faf8f2;border:1px solid #e3ddca;color:#1c2027;
  }
  .modal .field input:focus, .modal .field select:focus, .modal .field textarea:focus{
    border-color:var(--accent);
  }
  .modal-actions{
    display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.4rem;
  }
  .modal-close{
    position:absolute;
  }
  .modal-head{
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .icon-btn{
    background:transparent;border:none;color:#9c8f6f;padding:.2rem;border-radius:6px;
  }
  .icon-btn:hover{color:#1c2027;background:#f1ecdd;}
  .icon-btn svg{width:20px;height:20px;display:block;}

  /* machine detail */
  .detail-head{
    display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.6rem;flex-wrap:wrap;gap:1rem;
  }
  .machine-meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1rem;
    margin-bottom:1.6rem;
  }
  .meta-item{
    background:#fff;border:1px solid #e3ddca;border-radius:10px;padding:.9rem 1rem;
  }
  .meta-item .k{font-size:.72rem;color:#8a8267;margin-bottom:.25rem;}
  .meta-item .v{font-size:.92rem;font-weight:600;}

  .timeline{
    position:relative;
    padding-left:1.6rem;
  }
  .timeline::before{
    content:"";
    position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:#e3ddca;
  }
  .t-entry{
    position:relative;
    padding-bottom:1.4rem;
  }
  .t-entry:last-child{padding-bottom:0;}
  .t-entry::before{
    content:"";
    position:absolute;left:-1.6rem;top:.3rem;
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    border:2px solid #fff;
    box-shadow:0 0 0 1px #e3ddca;
  }
  .t-date{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:#8a8267;margin-bottom:.15rem;}
  .t-title{font-weight:600;font-size:.92rem;margin-bottom:.15rem;}
  .t-desc{font-size:.85rem;color:#4a4536;margin-bottom:.35rem;line-height:1.5;}
  .t-tags{display:flex;gap:.5rem;flex-wrap:wrap;font-size:.74rem;color:#77705f;}
  .t-tags span{background:#f1ecdd;padding:.2rem .55rem;border-radius:999px;}

  @media (max-width:860px){
    .app-shell{grid-template-columns:1fr;}
    .sidebar{
      flex-direction:row;
      align-items:center;
      overflow-x:auto;
      padding:.8rem 1rem;
    }
    .sb-brand{margin-bottom:0;margin-right:.6rem;}
    .sb-spacer{display:none;}
    .sb-user{display:none;}
    .nav-item{white-space:nowrap;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .dash-grid{grid-template-columns:1fr;}
    .machine-meta{grid-template-columns:1fr;}
    .main{padding:1.4rem 1.1rem 2.4rem;}
    .field-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================================================
   ระบบบันทึกการซ่อมบำรุงเครื่องจักร
   เก็บข้อมูลในหน่วยความจำระหว่างใช้งาน (ข้อมูลจะรีเซ็ตเมื่อรีเฟรชหน้า)
   ============================================================ */

const state = {
  view: 'login',            // login | register | app
  appView: 'dashboard',     // dashboard | machines | detail | lines | lineDetail
  currentUser: null,
  selectedMachineId: null,
  selectedLine: null,
  modal: null,               // null | 'add-machine' | 'edit-machine' | 'add-maintenance'
  editTargetId: null,
  searchTerm: '',
  authError: '',
  authNotice: '',
  users: [
    { username:'admin', password:'admin123', fullname:'ผู้ดูแลระบบ', role:'ผู้ดูแลระบบ', createdAt: Date.now() }
  ],
  machines: [
    { id:'m1', code:'CNC-01', name:'เครื่องกลึง CNC เบอร์ 1', location:'โรงงาน A / ไลน์ผลิต 1', line:'ไลน์ผลิต 1', category:'เครื่องจักรกล', installDate:'2021-03-15', notes:'' },
    { id:'m2', code:'CMP-02', name:'เครื่องอัดลม เบอร์ 2', location:'ห้องเครื่องอัดลม', line:'', category:'ระบบลมอัด', installDate:'2019-11-02', notes:'' },
    { id:'m3', code:'CNV-05', name:'สายพานลำเลียง เบอร์ 5', location:'โรงงาน B / ไลน์บรรจุ', line:'ไลน์บรรจุ', category:'ระบบลำเลียง', installDate:'2022-06-20', notes:'' },
    { id:'m4', code:'CNC-02', name:'เครื่องกลึง CNC เบอร์ 2', location:'โรงงาน A / ไลน์ผลิต 1', line:'ไลน์ผลิต 1', category:'เครื่องจักรกล', installDate:'2021-05-02', notes:'' },
    { id:'m5', code:'WLD-01', name:'เครื่องเชื่อมอัตโนมัติ เบอร์ 1', location:'โรงงาน A / ไลน์ผลิต 2', line:'ไลน์ผลิต 2', category:'เครื่องจักรกล', installDate:'2020-09-18', notes:'' }
  ],
  maintenance: [
    { id:'r1', machineId:'m1', date:'2026-07-10', type:'บำรุงรักษาตามระยะ', technician:'สมชาย ใจดี', description:'เปลี่ยนน้ำมันหล่อลื่นและตรวจสอบสปินเดิล', parts:'น้ำมันหล่อลื่น 2 ลิตร', cost:'1200', nextDueDate:'2026-10-10', notes:'' },
    { id:'r2', machineId:'m2', date:'2026-06-01', type:'ซ่อมฉุกเฉิน', technician:'วิชัย มั่นคง', description:'เปลี่ยนวาล์วระบายที่รั่ว', parts:'วาล์วระบายแรงดัน x1', cost:'3500', nextDueDate:'2026-09-01', notes:'ตรวจพบเสียงดังผิดปกติก่อนซ่อม' },
    { id:'r3', machineId:'m3', date:'2026-08-05', type:'ตรวจสอบตามระยะ', technician:'สมชาย ใจดี', description:'ตรวจสอบความตึงสายพานและมอเตอร์ขับ', parts:'-', cost:'0', nextDueDate:'2026-11-05', notes:'' },
    { id:'r4', machineId:'m4', date:'2026-08-20', type:'บำรุงรักษาตามระยะ', technician:'สมชาย ใจดี', description:'เปลี่ยนน้ำมันหล่อลื่นและตรวจสอบสปินเดิล', parts:'น้ำมันหล่อลื่น 2 ลิตร', cost:'1200', nextDueDate:'2026-08-25', notes:'' },
    { id:'r5', machineId:'m5', date:'2026-05-15', type:'บำรุงรักษาตามระยะ', technician:'วิชัย มั่นคง', description:'ตรวจสอบหัวเชื่อมและระบบป้อนลวด', parts:'หัวเชื่อม x2', cost:'800', nextDueDate:'2026-08-15', notes:'' }
  ]
};

// ---------- helpers ----------
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' });
}
function fmtCost(c){
  const n = parseFloat(c);
  if(isNaN(n)) return '—';
  return n.toLocaleString('th-TH', {minimumFractionDigits:0}) + ' บาท';
}
function todayISO(){
  const t = new Date();
  return t.toISOString().slice(0,10);
}

function machineRecords(machineId){
  return state.maintenance
    .filter(r => r.machineId === machineId)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
}

function machineStatus(machineId){
  const recs = machineRecords(machineId);
  if(recs.length === 0) return { label:'ยังไม่มีประวัติ', cls:'none' };
  const latest = recs[0];
  if(!latest.nextDueDate) return { label:'ไม่ได้กำหนดรอบถัดไป', cls:'none' };
  const diffDays = Math.floor((new Date(latest.nextDueDate) - new Date(todayISO())) / 86400000);
  if(diffDays < 0) return { label:'เกินกำหนด', cls:'overdue', diffDays };
  if(diffDays <= 7) return { label:'ใกล้ครบกำหนด', cls:'duesoon', diffDays };
  return { label:'ปกติ', cls:'ok', diffDays };
}

function badgeHtml(status){
  return `<span class="badge badge-${status.cls}"><span class="dot" style="background:currentColor"></span>${status.label}</span>`;
}

function handleLogin(e){
  e.preventDefault();
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const found = state.users.find(x => x.username === u && x.password === p);
  if(!found){
    state.authError = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
    render();
    return false;
  }
  state.currentUser = found;
  state.authError='';
  state.authNotice='';
  state.view='app';
  state.appView='dashboard';
  render();
  return false;
}

function handleRegister(e){
  e.preventDefault();
  const fullname = document.getElementById('reg-fullname').value.trim();
  const role = document.getElementById('reg-role').value;
  const username = document.getElementById('reg-username').value.trim();
  const pw1 = document.getElementById('reg-password').value;
  const pw2 = document.getElementById('reg-password2').value;

  if(state.users.some(x => x.username.toLowerCase() === username.toLowerCase())){
    state.authError = 'มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาเลือกชื่ออื่น';
    render(); return false;
  }
  if(pw1.length < 6){
    state.authError = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
    render(); return false;
  }
  if(pw1 !== pw2){
    state.authError = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
    render(); return false;
  }
  state.users.push({ username, password:pw1, fullname, role, createdAt:Date.now() });
  state.authError='';
  state.authNotice='สร้างบัญชีสำเร็จ กรุณาเข้าสู่ระบบ';
  state.view='login';
  render();
  return false;
}

function groupMachinesByLine(){
  const groups = {};
  state.machines.forEach(m => {
    const key = (m.line && m.line.trim()) ? m.line.trim() : 'ไม่ระบุไลน์';
    if(!groups[key]) groups[key] = [];
    groups[key].push(m);
  });
  return groups;
}
function lineStatusCounts(list){
  let overdue=0, duesoon=0, ok=0, none=0;
  list.forEach(m => {
    const s = machineStatus(m.id);
    if(s.cls==='overdue') overdue++;
    else if(s.cls==='duesoon') duesoon++;
    else if(s.cls==='ok') ok++;
    else none++;
  });
  return {overdue, duesoon, ok, none};
}

        <div class="stat-card"><div class="lbl">เครื่องจักรทั้งหมด</div><div class="val">${state.machines.length}</div></div>
        <div class="stat-card ok"><div class="lbl">ปกติ</div><div class="val">${overall.ok}</div></div>
        <div class="stat-card amber"><div class="lbl">ใกล้ครบกำหนด</div><div class="val">${overall.duesoon}</div></div>
        <div class="stat-card warn"><div class="lbl">เกินกำหนด</div><div class="val">${overall.overdue}</div></div>
      </div>
    </div>

    <div class="line-grid">
      ${lineNames.map(name => {
        const list = groups[name];
        const c = lineStatusCounts(list);
        const pct = list.length ? Math.round((c.ok/list.length)*100) : 0;
        const barColor = c.overdue>0 ? 'var(--warn)' : c.duesoon>0 ? '#b7841f' : '#2f7a53';
        const safeName = name.replace(/'/g, "\\'");
        return `
        <div class="line-card" onclick="viewLine('${safeName}')">
          <div class="line-card-head">
            <div class="line-card-name">${ICONS.layers} ${esc(name)}</div>
            <div class="line-card-count">${list.length} เครื่อง</div>
          </div>
          <div class="line-bar"><div class="line-bar-fill" style="width:${pct}%;background:${barColor};"></div></div>
          <div class="line-card-badges">
            ${c.ok ? `<span class="badge badge-ok"><span class="dot" style="background:currentColor"></span>ปกติ ${c.ok}</span>` : ''}
            ${c.duesoon ? `<span class="badge badge-duesoon"><span class="dot" style="background:currentColor"></span>ใกล้ครบ ${c.duesoon}</span>` : ''}
            ${c.overdue ? `<span class="badge badge-overdue"><span class="dot" style="background:currentColor"></span>เกินกำหนด ${c.overdue}</span>` : ''}
            ${c.none ? `<span class="badge badge-none"><span class="dot" style="background:currentColor"></span>ไม่มีประวัติ ${c.none}</span>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function viewLine(lineName){
  state.selectedLine = lineName;
  state.appView = 'lineDetail';
  state.searchTerm = '';
  render();
}

function renderLineDetail(){
  const lineName = state.selectedLine;
  const list = state.machines.filter(m => {
    const key = (m.line && m.line.trim()) ? m.line.trim() : 'ไม่ระบุไลน์';
    return key === lineName;
  });
  const term = state.searchTerm.trim().toLowerCase();
  const filtered = list.filter(m =>
    !term || m.name.toLowerCase().includes(term) || m.code.toLowerCase().includes(term) || m.location.toLowerCase().includes(term)
  );
  const c = lineStatusCounts(list);

  return `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:1.1rem;" onclick="goto('lines')">${ICONS.back} กลับไปหน้าไลน์การผลิตทั้งหมด</button>

    <div class="topbar">
      <div>
        <div class="eyebrow mono">ไลน์การผลิต</div>
        <h1>${esc(lineName)}</h1>
        <div class="sub">${list.length} เครื่องจักรในไลน์นี้</div>
      </div>
      <button class="btn btn-primary" onclick="openModal('add-machine')">${ICONS.plus} เพิ่มเครื่องจักรใหม่</button>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">เครื่องจักรในไลน์นี้</div><div class="val">${list.length}</div></div>
      <div class="stat-card ok"><div class="lbl">ปกติ</div><div class="val">${c.ok}</div></div>
      <div class="stat-card amber"><div class="lbl">ใกล้ครบกำหนด</div><div class="val">${c.duesoon}</div></div>
      <div class="stat-card warn"><div class="lbl">เกินกำหนด</div><div class="val">${c.overdue}</div></div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        ${ICONS.search}
        <input type="text" placeholder="ค้นหาในไลน์นี้..." value="${esc(state.searchTerm)}" oninput="state.searchTerm=this.value; render();">
      </div>
    </div>

    <div class="panel-card" style="padding:0;overflow:hidden;">
      ${filtered.length === 0 ? `
        <div class="empty-state">
          <div class="ico">${ICONS.empty}</div>
          <h4>${list.length===0 ? 'ยังไม่มีเครื่องจักรในไลน์นี้' : 'ไม่พบเครื่องจักรที่ค้นหา'}</h4>
        </div>` : `
      <table>
        <thead>
          <tr><th style="padding-left:1.4rem;">รหัส</th><th>ชื่อเครื่องจักร</th><th>ตำแหน่ง</th><th>ประเภท</th><th>สถานะ</th><th>รอบถัดไป</th></tr>
        </thead>
        <tbody>
          ${filtered.map(m => {
            const s = machineStatus(m.id);
            return `<tr class="row-click" onclick="viewMachine('${m.id}')">
              <td class="mono" style="padding-left:1.4rem;">${esc(m.code)}</td>
              <td style="font-weight:600;">${esc(m.name)}</td>
              <td>${esc(m.location)}</td>
              <td>${esc(m.category)}</td>
              <td>${badgeHtml(s)}</td>
              <td class="mono">${fmtDate(machineRecords(m.id)[0]?.nextDueDate)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function viewMachine(id){
  state.selectedMachineId = id;
  state.appView = 'detail';
  render();
}

// ================= MACHINE DETAIL =================
function renderDetail(){
  const m = state.machines.find(x=>x.id===state.selectedMachineId);
  if(!m){
    return `<div class="empty-state"><h4>ไม่พบเครื่องจักรนี้</h4><button class="btn btn-ghost btn-sm" onclick="goto('machines')">กลับไปหน้ารายการ</button></div>`;
  }
  const s = machineStatus(m.id);
  const recs = machineRecords(m.id);

  return `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:1.1rem;" onclick="goto('machines')">${ICONS.back} กลับไปหน้ารายการเครื่องจักร</button>

    <div class="detail-head">
      <div>
        <div class="eyebrow mono">${esc(m.code)}</div>
        <h1 style="margin:0 0 .3rem;">${esc(m.name)}</h1>
        ${badgeHtml(s)}
      </div>
      <div style="display:flex;gap:.6rem;">
        <button class="btn btn-ghost btn-sm" onclick="openModal('edit-machine','${m.id}')">แก้ไขข้อมูล</button>
        <button class="btn btn-primary btn-sm" onclick="openModal('add-maintenance','${m.id}')">${ICONS.plus} บันทึกงานซ่อมบำรุง</button>
      </div>
    </div>

    <div class="machine-meta">
      <div class="meta-item"><div class="k">ตำแหน่ง / แผนก</div><div class="v">${esc(m.location)}</div></div>
      <div class="meta-item"><div class="k">ไลน์การผลิต</div><div class="v">${m.line ? esc(m.line) : '—'}</div></div>
      <div class="meta-item"><div class="k">ประเภทเครื่องจักร</div><div class="v">${esc(m.category)}</div></div>
      <div class="meta-item"><div class="k">วันที่ติดตั้ง</div><div class="v">${fmtDate(m.installDate)}</div></div>
    </div>

    <div class="panel-card">
      <h3>ประวัติการซ่อมบำรุง (${recs.length} รายการ)</h3>
      ${recs.length === 0 ? `
        <div class="empty-state">
          <div class="ico">${ICONS.wrench}</div>
          <h4>ยังไม่มีประวัติการซ่อมบำรุง</h4>
          <p>บันทึกงานซ่อมบำรุงครั้งแรกของเครื่องจักรนี้</p>
          <button class="btn btn-primary btn-sm" onclick="openModal('add-maintenance','${m.id}')">บันทึกงานซ่อมบำรุง</button>
        </div>` : `
      <div class="timeline">
        ${recs.map(r => `
          <div class="t-entry">
            <div class="t-date">${fmtDate(r.date)}</div>
            <div class="t-title">${esc(r.type)} — ${esc(r.technician)}</div>
            <div class="t-desc">${esc(r.description)}</div>
            <div class="t-tags">
              <span>อะไหล่: ${esc(r.parts || '-')}</span>
              <span>ค่าใช้จ่าย: ${fmtCost(r.cost)}</span>
              <span>รอบถัดไป: ${fmtDate(r.nextDueDate)}</span>
            </div>
          </div>
        `).join('')}
      </div>`}
    </div>
  `;
}

// ================= MODALS =================
function openModal(type, id){
  state.modal = type;
  state.editTargetId = id || null;
  render();
}
function closeModal(){
  state.modal = null;
  state.editTargetId = null;
  render();
}

function renderModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

  let inner = '';
  if(state.modal === 'add-machine' || state.modal === 'edit-machine'){
    const editing = state.modal === 'edit-machine';
    const m = editing ? state.machines.find(x=>x.id===state.editTargetId) : null;
    inner = `
      <div class="modal-head">
        <h2>${editing ? 'แก้ไขข้อมูลเครื่องจักร' : 'เพิ่มเครื่องจักรใหม่'}</h2>
        <button class="icon-btn" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <form onsubmit="return submitMachine(event, ${editing ? `'${m.id}'` : 'null'})">
        <div class="field-row">
          <div class="field"><label>รหัสเครื่องจักร</label><input type="text" id="mf-code" value="${esc(m?.code||'')}" required></div>
          <div class="field"><label>ประเภทเครื่องจักร</label><input type="text" id="mf-category" value="${esc(m?.category||'')}" placeholder="เช่น เครื่องจักรกล" required></div>
        </div>
        <div class="field"><label>ชื่อเครื่องจักร</label><input type="text" id="mf-name" value="${esc(m?.name||'')}" required></div>
        <div class="field"><label>ตำแหน่ง / แผนก</label><input type="text" id="mf-location" value="${esc(m?.location||'')}" required></div>
        <div class="field"><label>ไลน์การผลิต <span style="font-weight:400;color:#8a8267;">(ถ้ามี)</span></label><input type="text" id="mf-line" value="${esc(m?.line||'')}" placeholder="เช่น ไลน์ผลิต 1"></div>
        <div class="field"><label>วันที่ติดตั้ง</label><input type="date" id="mf-install" value="${esc(m?.installDate||'')}"></div>
        <div class="field"><label>หมายเหตุ</label><textarea id="mf-notes" rows="2">${esc(m?.notes||'')}</textarea></div>
        <div class="modal-actions">
          ${editing ? `<button type="button" class="btn btn-danger btn-sm" onclick="deleteMachine('${m.id}')" style="margin-right:auto;">ลบเครื่องจักรนี้</button>` : ''}
          <button type="button" class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">${editing ? 'บันทึกการแก้ไข' : 'เพิ่มเครื่องจักร'}</button>
        </div>
      </form>
    `;
  } else if(state.modal === 'add-maintenance'){
    const machineId = state.editTargetId;
    const m = state.machines.find(x=>x.id===machineId);
    inner = `
      <div class="modal-head">
        <h2>บันทึกงานซ่อมบำรุง</h2>
        <button class="icon-btn" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <p style="font-size:.85rem;color:#8a8267;margin:-.6rem 0 1.2rem;">สำหรับเครื่องจักร: <strong style="color:#1c2027;">${esc(m?.name||'')}</strong></p>
      <form onsubmit="return submitMaintenance(event, '${machineId}')">
        <div class="field-row">
          <div class="field"><label>วันที่ดำเนินการ</label><input type="date" id="rf-date" value="${todayISO()}" required></div>
          <div class="field">
            <label>ประเภทงาน</label>
            <select id="rf-type">
              <option>บำรุงรักษาตามระยะ</option>
              <option>ตรวจสอบตามระยะ</option>
              <option>ซ่อมฉุกเฉิน</option>
              <option>เปลี่ยนอะไหล่</option>
              <option>อื่น ๆ</option>
            </select>
          </div>
        </div>
        <div class="field"><label>ผู้ดำเนินการ</label><input type="text" id="rf-tech" required placeholder="ชื่อช่างหรือทีมงาน"></div>
        <div class="field"><label>รายละเอียดงาน</label><textarea id="rf-desc" rows="2" required placeholder="อธิบายงานที่ทำ"></textarea></div>
        <div class="field-row">
          <div class="field"><label>อะไหล่ที่ใช้</label><input type="text" id="rf-parts" placeholder="ระบุ - หากไม่มี"></div>
          <div class="field"><label>ค่าใช้จ่าย (บาท)</label><input type="number" id="rf-cost" min="0" step="0.01" placeholder="0"></div>
        </div>
        <div class="field"><label>กำหนดบำรุงรักษาครั้งถัดไป</label><input type="date" id="rf-next"></div>
        <div class="field"><label>หมายเหตุเพิ่มเติม</label><textarea id="rf-notes" rows="2"></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">บันทึกงานซ่อมบำรุง</button>
        </div>
      </form>
    `;
  }

  overlay.innerHTML = `<div class="modal">${inner}</div>`;
  document.getElementById('root').appendChild(overlay);
}

function submitMachine(e, editingId){
  e.preventDefault();
  const data = {
    code: document.getElementById('mf-code').value.trim(),
    category: document.getElementById('mf-category').value.trim(),
    name: document.getElementById('mf-name').value.trim(),
    location: document.getElementById('mf-location').value.trim(),
    line: document.getElementById('mf-line').value.trim(),
    installDate: document.getElementById('mf-install').value,
    notes: document.getElementById('mf-notes').value.trim()
  };
  if(editingId){
    const m = state.machines.find(x=>x.id===editingId);
    Object.assign(m, data);
  } else {
    state.machines.push({ id: uid(), ...data });
  }
  closeModal();
  return false;
}

function deleteMachine(id){
  state.machines = state.machines.filter(x=>x.id!==id);
  state.maintenance = state.maintenance.filter(x=>x.machineId!==id);
  state.modal = null;
  state.appView = 'machines';
  state.selectedMachineId = null;
  render();
}

function submitMaintenance(e, machineId){
  e.preventDefault();
  const rec = {
    id: uid(),
    machineId,
    date: document.getElementById('rf-date').value,
    type: document.getElementById('rf-type').value,
    technician: document.getElementById('rf-tech').value.trim(),
    description: document.getElementById('rf-desc').value.trim(),
    parts: document.getElementById('rf-parts').value.trim(),
    cost: document.getElementById('rf-cost').value,
    nextDueDate: document.getElementById('rf-next').value,
    notes: document.getElementById('rf-notes').value.trim()
  };
  state.maintenance.push(rec);
  closeModal();
  return false;
}

// ---------- boot ----------
render();
</script>
</body>
</html>
