<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAINTLOG — ระบบบันทึกการซ่อมบำรุง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Recharts + deps -->
<script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/react-is@18/umd/react-is.production.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.15.0/umd/Recharts.js"></script>
<!-- Babel (in-browser JSX transform) -->
<script crossorigin src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<style>
  :root {
    --bg:#F5F7FA; --surface:#FFFFFF; --surface-alt:#F1F4F8;
    --border:#E4E8EF; --hi:#1F2430; --lo:#68707D;
    --primary:#2F6FED; --primary-soft:#EAF1FE;
    --amber:#F59E0B; --amber-soft:#FEF3E2;
    --teal:#16A34A; --teal-soft:#E9F8EF;
    --red:#EF4444; --red-soft:#FDEDED;
    --blue:#0EA5E9; --blue-soft:#E8F7FE;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.06);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Noto Sans Thai', 'IBM Plex Sans', sans-serif; color: var(--hi); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }

  .app { background: var(--bg); color: var(--hi); min-height: 100vh; display: flex; font-size: 14.5px; }
  .headline { font-family: 'Kanit', sans-serif; font-weight: 600; }

  .sidebar { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 3px; }
  .brand { padding: 4px 8px 22px 8px; }
  .brand-mark { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .brand-dot { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), #5B93F5); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow: var(--shadow); }
  .brand-dot::after { content: ""; width: 11px; height: 11px; border-radius: 3px; background: #fff; }
  .brand-title { font-family:'Kanit'; font-weight:700; font-size: 19px; line-height:1.1; color: var(--hi); }
  .brand-sub { color: var(--lo); font-size: 11.5px; margin-top: 3px; }
  .line-switch { padding: 0 8px 16px 8px; }
  .line-switch-label { display:block; font-size: 10.5px; color: var(--lo); font-weight:600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .line-select { width: 100%; font-weight: 600; color: var(--primary); background: var(--primary-soft); border-color: transparent; }
  .line-select:focus { box-shadow: 0 0 0 3px var(--primary-soft); }
  .nav-item { display:flex; align-items:center; gap: 11px; padding: 10px 12px; border-radius: 9px; color: var(--lo); cursor: pointer; font-size: 13.5px; font-weight: 500; user-select:none; transition: background .12s, color .12s; }
  .nav-item:hover { color: var(--hi); background: var(--surface-alt); }
  .nav-item.active { color: var(--primary); background: var(--primary-soft); }
  .nav-item.active .nav-ico { color: var(--primary); }
  .nav-ico { width: 18px; height: 18px; flex-shrink:0; color: var(--lo); display:flex; align-items:center; justify-content:center; }
  .nav-ico svg { width: 18px; height: 18px; }
  .nav-count { margin-left:auto; font-family:'IBM Plex Mono'; font-size: 10.5px; color: var(--lo); background: var(--surface-alt); padding: 2px 7px; border-radius: 999px; }
  .sidebar-foot { margin-top: auto; padding: 14px 10px 0 10px; border-top: 1px solid var(--border); color: var(--lo); font-size: 11px; line-height: 1.6;}

  .main { flex: 1; padding: 30px 36px 60px; max-width: 1220px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 22px; gap: 12px; flex-wrap: wrap; }
  .page-head-actions { display:flex; gap: 10px; flex-wrap: wrap; }
  .page-title { font-family:'Kanit'; font-weight: 600; font-size: 25px; color: var(--hi); }
  .page-desc { color: var(--lo); font-size: 13px; margin-top: 4px; }
  .btn { font-family:'Noto Sans Thai'; font-weight: 600; font-size: 13.5px; padding: 10px 18px; background: var(--primary); color: #fff; border: none; cursor: pointer; border-radius: 9px; box-shadow: var(--shadow); transition: filter .12s, transform .05s; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn-ghost { background: var(--surface); color: var(--hi); border: 1px solid var(--border); box-shadow: none; }
  .btn-ghost:hover { border-color: var(--lo); filter:none; background: var(--surface-alt); }
  .btn:disabled, .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
  .btn:disabled:hover, .btn-ghost:disabled:hover { filter:none; background: var(--surface); border-color: var(--border); }

  .bracket { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
  .bk { display: none; }

  .kpi-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi-label { color: var(--lo); font-size: 11.5px; margin-bottom: 9px; font-weight: 500; }
  .kpi-top { display:flex; align-items:flex-start; justify-content:space-between; gap: 8px; }
  .kpi-top .kpi-label { margin-bottom: 9px; }
  .kpi-value { font-family:'Kanit'; font-weight: 700; font-size: 27px; line-height:1; color: var(--hi); }
  .kpi-sub { color: var(--lo); font-size: 11.5px; margin-top: 7px; }

  .formula-toggle { background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; white-space: nowrap; font-family: 'Noto Sans Thai'; }
  .formula-toggle:hover { text-decoration: underline; }
  .formula-toggle-inline { display: block; margin-top: 10px; }
  .formula-box { margin-top: 10px; padding: 10px 12px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--hi); line-height: 1.7; white-space: pre-wrap; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .panel-title { font-family:'Kanit'; font-weight: 600; font-size: 16px; margin-bottom: 2px; color: var(--hi); }
  .panel-sub { color: var(--lo); font-size: 12px; margin-bottom: 16px; }
  .chart-row { display:grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .chart-row2 { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .line-compare-table { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; overflow-x: auto; }
  .line-compare-row { display:grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 8px; padding: 9px 6px; font-size: 12.5px; border-radius: 8px; cursor: pointer; align-items:center; min-width: 380px; }
  .line-compare-row:hover { background: var(--surface-alt); }
  .line-compare-head { color: var(--lo); font-weight: 600; font-size: 11px; cursor: default; }
  .line-compare-head:hover { background: none; }
  .line-compare-name { font-weight: 600; }
  .line-kpi-table { margin-top: 4px; overflow-x: auto; }
  .line-kpi-row { display:grid; grid-template-columns: 1.3fr .7fr 1fr 1fr 1fr 1.1fr; gap: 8px; padding: 11px 6px; font-size: 12.5px; align-items:center; border-bottom: 1px solid var(--border); min-width: 480px; }
  .line-kpi-row:last-child { border-bottom: none; }
  .line-kpi-head { color: var(--lo); font-weight: 600; font-size: 11px; }

  .tag { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space:nowrap; border: none; }

  .toolbar { display:flex; gap: 10px; margin-bottom: 14px; align-items:center; flex-wrap: wrap; }
  .input, select.input { background: var(--surface); border: 1px solid var(--border); color: var(--hi); padding: 10px 12px; font-size: 13.5px; font-family:'Noto Sans Thai'; border-radius: 9px; transition: border-color .12s, box-shadow .12s; }
  .input:focus, select.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .search { flex: 1; min-width: 180px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; color: var(--lo); font-weight: 600; font-size: 11px; padding: 12px 14px; background: var(--surface-alt); }
  thead tr th:first-child { border-top-left-radius: var(--radius); }
  thead tr th:last-child { border-top-right-radius: var(--radius); }
  tbody td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-alt); }
  .equip-name { font-weight: 600; }
  .equip-note { color: var(--lo); font-size: 12px; margin-top: 3px; max-width: 260px; }
  .row-actions { display:flex; gap: 6px; }
  .icon-btn { background: var(--surface); border: 1px solid var(--border); color: var(--lo); font-size: 11.5px; font-weight: 500; padding: 5px 11px; cursor:pointer; border-radius: 7px; transition: all .12s; }
  .icon-btn:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
  .mono { font-family: 'IBM Plex Mono'; font-size: 12.5px; }

  .empty { text-align:center; padding: 56px 20px; color: var(--lo); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty .headline { font-size: 18px; color: var(--hi); margin-bottom: 6px; }

  .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  .field { display:flex; flex-direction:column; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--lo); font-weight: 500; }
  textarea.input { resize: vertical; min-height: 80px; font-family:'Noto Sans Thai'; }
  .form-actions { display:flex; gap: 10px; margin-top: 20px; justify-content:flex-end; }

  .toast { position: fixed; bottom: 24px; right: 28px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--teal); border-radius: 10px; box-shadow: var(--shadow); padding: 13px 20px; font-size: 13.5px; font-weight: 500; z-index: 50; }
  .toast.err { border-left-color: var(--red); }
  .loading-wrap { display:flex; align-items:center; justify-content:center; height: 60vh; width:100%; color: var(--lo); }

  .nav-badge { margin-left:auto; font-family:'IBM Plex Mono'; font-size: 10.5px; font-weight:700; color:#fff; background: var(--red); padding: 2px 7px; border-radius: 999px; }

  .metric-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; position: relative; }
  .metric-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 4px; gap: 8px; }
  .metric-label { color: var(--lo); font-size: 12.5px; font-weight: 500; }
  .metric-status { font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space:nowrap; border: none; }
  .metric-value { font-family:'Kanit'; font-weight: 700; font-size: 30px; line-height:1; margin: 8px 0 12px; }
  .metric-desc { color: var(--lo); font-size: 11.5px; margin-top: 8px; line-height: 1.55; }
  .progress-track { height: 7px; background: var(--surface-alt); border-radius: 999px; overflow:hidden; }
  .progress-fill { height: 100%; border-radius: 999px; }
  .metric-num-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }

  .alert-section-title { font-family:'Kanit'; font-weight:600; font-size: 15.5px; margin: 26px 0 12px; display:flex; align-items:center; gap: 8px; color: var(--hi); }
  .alert-section-title:first-child { margin-top: 0; }
  .alert-list { display:flex; flex-direction:column; gap: 9px; margin-bottom: 6px; }
  .alert-item { display:flex; align-items:center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--red); border-radius: 10px; box-shadow: var(--shadow); padding: 13px 16px; }
  .alert-item.warn { border-left-color: var(--amber); }
  .alert-item.ok { border-left-color: var(--teal); }
  .alert-main { flex: 1; min-width: 0; }
  .alert-title { font-weight: 600; font-size: 13.5px; }
  .alert-line-tag { margin-left: 8px; font-size: 10.5px; font-weight: 600; color: var(--primary); background: var(--primary-soft); padding: 2px 8px; border-radius: 999px; }
  .alert-sub { color: var(--lo); font-size: 12px; margin-top: 3px; }
  .alert-days { font-family:'IBM Plex Mono'; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .alert-empty { color: var(--lo); font-size: 13px; padding: 16px 4px; background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; text-align:center; }
  .schedule-toggle { display:flex; justify-content:flex-end; margin-bottom: 14px; }

  @media (max-width: 880px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; border-right:none; border-bottom:1px solid var(--border); padding: 12px; }
    .sidebar-foot { display:none; }
    .brand { display:none; }
    .line-switch { padding: 0 0 10px 0; }
    .nav-list { display:flex; flex-direction: row; overflow-x: auto; gap: 6px; }
    .nav-item { flex-direction: column; gap: 4px; padding: 8px 12px; font-size: 11px; min-width: 68px; position: relative; }
    .nav-count { display:none; }
    .nav-badge { position: absolute; top: 2px; right: 6px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-row, .chart-row2 { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .metric-grid, .metric-num-grid { grid-template-columns: 1fr; }
    .main { padding: 18px; }
    .row-actions { opacity: 1 !important; }
    .btn, .icon-btn { min-height: 38px; }
  }

  @media print {
    .no-print, .sidebar, .toolbar, .row-actions, .toast, .form-actions, .schedule-toggle { display: none !important; }
    .app { display: block; background: #fff; }
    .main { padding: 0; max-width: 100%; }
    body { background: #fff; }
    .panel, .metric-card, .bracket, .alert-item { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
    .page-head { margin-bottom: 14px; }
    table { font-size: 11px; }
    thead th { background: #f2f2f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

      <path d="M8 6h13" /><path d="M8 12h13" /><path d="M8 18h13" /><path d="M3 6h.01" /><path d="M3 12h.01" /><path d="M3 18h.01" />
    </svg>
  ),
  new: (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M12 8v8" /><path d="M8 12h8" />
    </svg>
  ),
};

function csvEscape(val) {
  const s = String(val === undefined || val === null ? "" : val);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function downloadTextFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportRecordsCSV(records, scopeLabel) {
  const headers = ["อุปกรณ์", "สายการผลิต", "ประเภทงาน", "วันที่", "ช่างซ่อม", "ค่าใช้จ่าย (บาท)", "เวลาหยุดเครื่อง (ชม.)", "ความสำคัญ", "สถานะ", "รายละเอียด"];
  const rows = records.map((r) => [
    r.equipment, r.line || "", TYPE_META[r.type] ? TYPE_META[r.type].label : r.type, r.date, r.technician,
    r.cost, r.downtime, PRIORITY_META[r.priority] ? PRIORITY_META[r.priority].label : r.priority,
    STATUS_META[r.status] ? STATUS_META[r.status].label : r.status, r.note || "",
  ]);
  const csv = "\uFEFF" + [headers, ...rows].map((row) => row.map(csvEscape).join(",")).join("\r\n");
  const datePart = todayISO();
  const safeScope = (scopeLabel || "all").replace(/[^a-zA-Zก-๙0-9]+/g, "-");
  downloadTextFile(`maintlog-${safeScope}-${datePart}.csv`, csv, "text/csv;charset=utf-8;");
}

function Bracket({ children, className = "" }) {
  return (
    <div className={`bracket ${className}`}>
      <span className="bk bk-tl" /><span className="bk bk-tr" />
      <span className="bk bk-bl" /><span className="bk bk-br" />
      {children}
    </div>
  );
}
function Tag({ meta }) {
  return <span className="tag" style={{ color: meta.color, background: meta.color + "1A" }}>{meta.label}</span>;
}
function KPI({ label, value, sub, accent, formula }) {
  const [showFormula, setShowFormula] = useState(false);
  return (
    <Bracket className="kpi">
      <div className="kpi-top">
        <div className="kpi-label">{label}</div>
        {formula && (
          <button type="button" className="formula-toggle" onClick={() => setShowFormula((v) => !v)}>
            {showFormula ? "ซ่อนสูตร" : "ดูสูตร"}
          </button>
        )}
      </div>
      <div className="kpi-value" style={accent ? { color: accent } : undefined}>{value}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
      {formula && showFormula && <div className="formula-box">{formula}</div>}
    </Bracket>
  );
}

function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SEED;
}
function saveRecords(records) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (e) {
    return false;
  }
}

function loadSchedules() {
  try {
    const raw = localStorage.getItem(SCHEDULE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return SEED_SCHEDULES;
}
function saveSchedules(schedules) {
  try {
    localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedules));
    return true;
  } catch (e) {
    return false;
  }
}

function App() {
  const [records, setRecords] = useState(null);
  const [schedules, setSchedules] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [query, setQuery] = useState("");
  const [filterType, setFilterType] = useState("all");
  const [filterStatus, setFilterStatus] = useState("all");
  const [selectedLine, setSelectedLine] = useState("all");
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => { setRecords(loadRecords()); setSchedules(loadSchedules()); }, []);

  const showToast = (msg, isError = false) => {
    setToast({ msg, isError });
    setTimeout(() => setToast(null), 2600);
  };

  const persist = useCallback((next) => {
    setRecords(next);
    const ok = saveRecords(next);
    if (!ok) showToast("บันทึกไม่สำเร็จ พื้นที่จัดเก็บอาจเต็ม", true);
  }, []);

  const persistSchedules = useCallback((next) => {
    setSchedules(next);
    const ok = saveSchedules(next);
    if (!ok) showToast("บันทึกไม่สำเร็จ พื้นที่จัดเก็บอาจเต็ม", true);
  }, []);

  const saveSchedule = (sc) => {
    if (!schedules) return;
    let next;
    if (sc.id && schedules.some((s) => s.id === sc.id)) {
      next = schedules.map((s) => (s.id === sc.id ? sc : s));
      showToast("แก้ไขการแจ้งเตือนแล้ว");
    } else {
      next = [{ ...sc, id: uid() }, ...schedules];
      showToast("ตั้งการแจ้งเตือนใหม่แล้ว");
    }
    persistSchedules(next);
  };

  const deleteSchedule = (id) => {
    if (!schedules) return;
    persistSchedules(schedules.filter((s) => s.id !== id));
    showToast("ลบการแจ้งเตือนแล้ว");
  };

  const completeSchedule = (sc) => {
    if (!schedules) return;
    if (sc.intervalDays && Number(sc.intervalDays) > 0) {
      const next = schedules.map((s) =>
        s.id === sc.id ? { ...s, nextDate: addDays(todayISO(), Number(sc.intervalDays)) } : s
      );
      persistSchedules(next);
      showToast("เลื่อนรอบแจ้งเตือนถัดไปแล้ว");
    } else {
      persistSchedules(schedules.filter((s) => s.id !== sc.id));
      showToast("ทำเครื่องหมายเสร็จสิ้นแล้ว");
    }
  };

  const saveRecord = (rec) => {
    if (!records) return;
    let next;
    if (rec.id && records.some((r) => r.id === rec.id)) {
      next = records.map((r) => (r.id === rec.id ? rec : r));
      showToast("แก้ไขรายการเรียบร้อย");
    } else {
      next = [{ ...rec, id: uid() }, ...records];
      showToast("บันทึกรายการใหม่แล้ว");
    }
    persist(next);
    setEditing(null);
    setTab("records");
  };

  const deleteRecord = (id) => {
    if (!records) return;
    persist(records.filter((r) => r.id !== id));
    showToast("ลบรายการแล้ว");
  };

  const allLines = useMemo(() => {
    if (!records) return [];
    const fromData = new Set(records.map((r) => r.line).filter(Boolean));
    DEFAULT_LINES.forEach((l) => fromData.add(l));
    return Array.from(fromData).sort();
  }, [records]);

  const scopedRecords = useMemo(() => {
    if (!records) return null;
    return selectedLine === "all" ? records : records.filter((r) => r.line === selectedLine);
  }, [records, selectedLine]);

  const scopedSchedules = useMemo(() => {
    if (!schedules) return null;
    return selectedLine === "all" ? schedules : schedules.filter((s) => !s.line || s.line === selectedLine);
  }, [schedules, selectedLine]);

  const filtered = useMemo(() => {
    if (!scopedRecords) return [];
    return scopedRecords
      .filter((r) => (filterType === "all" ? true : r.type === filterType))
      .filter((r) => (filterStatus === "all" ? true : r.status === filterStatus))
      .filter((r) => {
        if (!query.trim()) return true;
        const q = query.toLowerCase();
        return r.equipment.toLowerCase().includes(q) || r.technician.toLowerCase().includes(q) || (r.note || "").toLowerCase().includes(q);
      })
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }, [scopedRecords, query, filterType, filterStatus]);

  const stats = useMemo(() => {
    if (!scopedRecords || scopedRecords.length === 0) return null;
    const totalCost = scopedRecords.reduce((s, r) => s + Number(r.cost || 0), 0);
    const totalDowntime = scopedRecords.reduce((s, r) => s + Number(r.downtime || 0), 0);
    const overdue = scopedRecords.filter((r) => r.status === "overdue").length;
    const emergency = scopedRecords.filter((r) => r.type === "emergency").length;

    const byMonth = {};
    scopedRecords.forEach((r) => {
      const key = r.date.slice(0, 7);
      byMonth[key] = byMonth[key] || { month: key, cost: 0, count: 0 };
      byMonth[key].cost += Number(r.cost || 0);
      byMonth[key].count += 1;
    });
    const trend = Object.values(byMonth).sort((a, b) => (a.month > b.month ? 1 : -1)).map((d) => ({ ...d, label: fmtMonth(d.month + "-01") }));

    const byType = Object.keys(TYPE_META).map((t) => ({
      name: TYPE_META[t].label, value: scopedRecords.filter((r) => r.type === t).length, color: TYPE_META[t].color,
    })).filter((d) => d.value > 0);

    const byEquipMap = {};
    scopedRecords.forEach((r) => {
      byEquipMap[r.equipment] = byEquipMap[r.equipment] || { equipment: r.equipment, cost: 0, downtime: 0, count: 0 };
      byEquipMap[r.equipment].cost += Number(r.cost || 0);
      byEquipMap[r.equipment].downtime += Number(r.downtime || 0);
      byEquipMap[r.equipment].count += 1;
    });
    const byEquip = Object.values(byEquipMap).sort((a, b) => b.cost - a.cost).slice(0, 8);

    const byStatus = Object.keys(STATUS_META).map((s) => ({
      name: STATUS_META[s].label, value: scopedRecords.filter((r) => r.status === s).length, color: STATUS_META[s].color,
    })).filter((d) => d.value > 0);

    // ---- KPI / performance metrics ----
    const total = scopedRecords.length;
    const completed = scopedRecords.filter((r) => r.status === "completed").length;
    const preventiveCount = scopedRecords.filter((r) => r.type === "preventive").length;

    const pmRatioPct = total ? (preventiveCount / total) * 100 : 0;
    const emergencyRatePct = total ? (emergency / total) * 100 : 0;
    const onTimeRatePct = total ? (completed / total) * 100 : 0;
    const overdueRatePct = total ? (overdue / total) * 100 : 0;
    const mttrHours = total ? totalDowntime / total : 0;
    const avgCostPerJob = total ? totalCost / total : 0;

    const sortedDates = scopedRecords.map((r) => r.date).sort();
    const periodDays = Math.max(1, daysBetween(sortedDates[0], sortedDates[sortedDates.length - 1]) + 1);
    const equipCount = Object.keys(byEquipMap).length || 1;
    const totalPossibleHours = periodDays * 24 * equipCount;
    const availabilityPct = totalPossibleHours > 0
      ? Math.max(0, Math.min(100, ((totalPossibleHours - totalDowntime) / totalPossibleHours) * 100))
      : 100;

    const failureDatesByEquip = {};
    scopedRecords.forEach((r) => {
      if (r.type === "corrective" || r.type === "emergency") {
        failureDatesByEquip[r.equipment] = failureDatesByEquip[r.equipment] || [];
        failureDatesByEquip[r.equipment].push(r.date);
      }
    });
    const mtbfSamples = [];
    Object.values(failureDatesByEquip).forEach((arr) => {
      if (arr.length >= 2) {
        const sorted = arr.slice().sort();
        for (let i = 1; i < sorted.length; i++) mtbfSamples.push(daysBetween(sorted[i - 1], sorted[i]));
      }
    });
    const mtbfDays = mtbfSamples.length ? mtbfSamples.reduce((a, b) => a + b, 0) / mtbfSamples.length : null;

    const kpi = {
      pmRatioPct, emergencyRatePct, onTimeRatePct, overdueRatePct, mttrHours, avgCostPerJob, availabilityPct, mtbfDays, periodDays,
      total, completed, preventiveCount, emergency, overdue, equipCount, totalPossibleHours, mtbfSampleCount: mtbfSamples.length,
    };

    return { totalCost, totalDowntime, overdue, emergency, trend, byType, byEquip, byStatus, count: scopedRecords.length, kpi };
  }, [scopedRecords]);

  // per-line comparison, always computed from the full unscoped dataset
  const lineStats = useMemo(() => {
    if (!records || records.length === 0) return [];
    const map = {};
    records.forEach((r) => {
      const line = r.line || "ไม่ระบุไลน์";
      map[line] = map[line] || { line, cost: 0, downtime: 0, count: 0, overdue: 0, completed: 0, preventive: 0 };
      map[line].cost += Number(r.cost || 0);
      map[line].downtime += Number(r.downtime || 0);
      map[line].count += 1;
      if (r.status === "overdue") map[line].overdue += 1;
      if (r.status === "completed") map[line].completed += 1;
      if (r.type === "preventive") map[line].preventive += 1;
    });
    return Object.values(map)
      .map((l) => ({
        ...l,
        overdueRatePct: l.count ? (l.overdue / l.count) * 100 : 0,
        onTimeRatePct: l.count ? (l.completed / l.count) * 100 : 0,
        pmRatioPct: l.count ? (l.preventive / l.count) * 100 : 0,
      }))
      .sort((a, b) => b.cost - a.cost);
  }, [records]);

  const alerts = useMemo(() => {
    if (!scopedRecords) return null;
    const today = todayISO();
    const overdueRecords = scopedRecords.filter((r) => r.status === "overdue").sort((a, b) => (a.date < b.date ? -1 : 1));
    const withDays = (scopedSchedules || []).map((s) => ({ ...s, daysLeft: daysBetween(today, s.nextDate) }));
    const overdueSchedules = withDays.filter((s) => s.daysLeft < 0).sort((a, b) => a.daysLeft - b.daysLeft);
    const dueSoonSchedules = withDays.filter((s) => s.daysLeft >= 0 && s.daysLeft <= 7).sort((a, b) => a.daysLeft - b.daysLeft);
    const upcomingSchedules = withDays.filter((s) => s.daysLeft > 7).sort((a, b) => a.daysLeft - b.daysLeft);
    const badgeCount = overdueRecords.length + overdueSchedules.length + dueSoonSchedules.length;
    return { overdueRecords, overdueSchedules, dueSoonSchedules, upcomingSchedules, badgeCount };
  }, [scopedRecords, scopedSchedules]);

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark"><span className="brand-dot" /><span className="brand-title">MAINTLOG</span></div>
          <div className="brand-sub">ระบบบันทึกการซ่อมบำรุง</div>
        </div>
        <div className="line-switch">
          <label className="line-switch-label">สายการผลิต</label>
          <select className="input line-select" value={selectedLine} onChange={(e) => setSelectedLine(e.target.value)}>
            <option value="all">ภาพรวมทุกไลน์ ({allLines.length})</option>
            {allLines.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
        <div className="nav-list">
        {[
          ["dashboard", "ภาพรวมและวิเคราะห์ข้อมูล"],
          ["kpi", "ตัวชี้วัดประสิทธิภาพ"],
          ["alerts", "แจ้งเตือนซ่อมบำรุง"],
          ["records", "รายการซ่อมบำรุง"],
          ["new", "บันทึกรายการใหม่"],
        ].map(([key, label]) => (
          <div key={key} className={`nav-item ${tab === key ? "active" : ""}`}
               onClick={() => { setTab(key); if (key === "new") setEditing({}); }}>
            <span className="nav-ico">{NAV_ICONS[key]}</span>
            <span>{label}</span>
            {key === "records" && <span className="nav-count">{scopedRecords ? scopedRecords.length : "–"}</span>}
            {key === "alerts" && alerts && alerts.badgeCount > 0 && <span className="nav-badge">{alerts.badgeCount}</span>}
          </div>
        ))}
        </div>
        <div className="sidebar-foot">ข้อมูลจัดเก็บในเบราว์เซอร์นี้เท่านั้น<br />(localStorage ของเครื่อง)</div>
      </aside>

      <main className="main">
        {!records ? (
          <div className="loading-wrap">กำลังโหลดข้อมูล…</div>
        ) : tab === "dashboard" ? (
          <Dashboard stats={stats} lineStats={lineStats} selectedLine={selectedLine} onSelectLine={setSelectedLine} onNew={() => { setEditing({}); setTab("new"); }} />
        ) : tab === "kpi" ? (
          <KpiPage stats={stats} lineStats={lineStats} selectedLine={selectedLine} />
        ) : tab === "alerts" ? (
          <AlertsPage
            alerts={alerts}
            records={scopedRecords}
            lineOptions={allLines}
            defaultLine={selectedLine === "all" ? (allLines[0] || "") : selectedLine}
            onCompleteSchedule={completeSchedule}
            onDeleteSchedule={deleteSchedule}
            onSaveSchedule={saveSchedule}
            onGoToRecord={(r) => { setEditing(r); setTab("new"); }}
          />
        ) : tab === "records" ? (
          <Records
            filtered={filtered} query={query} setQuery={setQuery}
            filterType={filterType} setFilterType={setFilterType}
            filterStatus={filterStatus} setFilterStatus={setFilterStatus}
            onEdit={(r) => { setEditing(r); setTab("new"); }}
            onDelete={deleteRecord}
            onNew={() => { setEditing({}); setTab("new"); }}
            total={scopedRecords ? scopedRecords.length : 0}
            selectedLine={selectedLine}
          />
        ) : (
          <RecordForm
            initial={editing}
            lineOptions={allLines}
            defaultLine={selectedLine === "all" ? (allLines[0] || "") : selectedLine}
            onCancel={() => setTab("records")}
            onSave={saveRecord}
          />
        )}
      </main>

      {toast && <div className={`toast ${toast.isError ? "err" : ""}`}>{toast.msg}</div>}
    </div>
  );
}

function Dashboard({ stats, lineStats, selectedLine, onSelectLine, onNew }) {
  if (!stats) {
    return (
      <div className="empty">
        <div className="headline">ยังไม่มีข้อมูล</div>
        <div style={{ marginBottom: 16 }}>เริ่มบันทึกรายการซ่อมบำรุงเพื่อดูการวิเคราะห์ข้อมูล</div>
        <button className="btn" onClick={onNew}>+ บันทึกรายการแรก</button>
      </div>
    );

  const showLineCompare = selectedLine === "all" && lineStats && lineStats.length > 1;
  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">ภาพรวมและวิเคราะห์ข้อมูล</div>
          <div className="page-desc">
            {selectedLine === "all" ? `ภาพรวมทุกไลน์ · ${stats.count} รายการ` : `${selectedLine} · ${stats.count} รายการ`}
          </div>
        </div>
        <div className="page-head-actions no-print">
          <button className="btn btn-ghost" onClick={() => window.print()}>พิมพ์ / PDF</button>
          <button className="btn" onClick={onNew}>+ บันทึกรายการใหม่</button>
        </div>
      </div>

      <div className="kpi-grid">
        <KPI label="ค่าใช้จ่ายรวม" value={fmtTHB(stats.totalCost)} sub={`${stats.count} รายการ`} />
        <KPI label="เวลาหยุดเครื่องรวม" value={`${stats.totalDowntime.toFixed(1)} ชม.`} sub="ทุกอุปกรณ์" />
        <KPI label="งานเกินกำหนด" value={stats.overdue} accent={stats.overdue > 0 ? COLORS.red : undefined} sub="ต้องติดตามด่วน" />
        <KPI label="ซ่อมฉุกเฉิน" value={stats.emergency} accent={stats.emergency > 0 ? COLORS.amber : undefined} sub="ไม่ได้วางแผนล่วงหน้า" />
      </div>

      {showLineCompare && (
        <div className="panel">
          <div className="panel-title">เปรียบเทียบระหว่างไลน์การผลิต</div>
          <div className="panel-sub">คลิกที่แถบเพื่อดูรายละเอียดของไลน์นั้น</div>
          <ResponsiveContainer width="100%" height={Math.max(180, lineStats.length * 46)}>
            <BarChart data={lineStats} layout="vertical" margin={{ left: 8, right: 24 }}
                      onClick={(d) => { if (d && d.activeLabel) onSelectLine(d.activeLabel); }}>
              <CartesianGrid stroke={COLORS.border} horizontal={false} />
              <XAxis type="number" tick={{ fill: COLORS.lo, fontSize: 11 }} axisLine={false} tickLine={false} tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`} />
              <YAxis type="category" dataKey="line" tick={{ fill: COLORS.hi, fontSize: 12, fontWeight: 600 }} axisLine={false} tickLine={false} width={80} />
              <Tooltip
                contentStyle={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, fontSize: 12.5, borderRadius: 10, boxShadow: "0 4px 14px rgba(16,24,40,.10)" }}
                formatter={(v, name) => [name === "cost" ? fmtTHB(v) : `${v.toFixed(1)} ชม.`, name === "cost" ? "ค่าใช้จ่าย" : "เวลาหยุดเครื่อง"]}
                cursor={{ fill: COLORS.surfaceAlt }}
              />
              <Bar dataKey="cost" name="cost" fill={COLORS.primary} radius={[0, 4, 4, 0]} barSize={16} cursor="pointer" />
            </BarChart>
          </ResponsiveContainer>
          <div className="line-compare-table">
            <div className="line-compare-row line-compare-head">
              <span>ไลน์</span><span>งานทั้งหมด</span><span>เกินกำหนด</span><span>Availability</span>
            </div>
            {lineStats.map((l) => (
              <div key={l.line} className="line-compare-row" onClick={() => onSelectLine(l.line)}>
                <span className="line-compare-name">{l.line}</span>
                <span>{l.count}</span>
                <span style={{ color: l.overdue > 0 ? COLORS.red : COLORS.lo }}>{l.overdue}</span>
                <span style={{ color: metricColor(l.onTimeRatePct, 90, 70) }}>{l.onTimeRatePct.toFixed(0)}%</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="chart-row">
        <div className="panel">
          <div className="panel-title">แนวโน้มค่าใช้จ่ายรายเดือน</div>
          <div className="panel-sub">ยอดค่าซ่อมบำรุงตามช่วงเวลา</div>
          <ResponsiveContainer width="100%" height={230}>
            <LineChart data={stats.trend} margin={{ left: -12, right: 8 }}>

function metricColor(value, good, warn, invert) {
  if (invert) {
    if (value <= good) return COLORS.teal;
    if (value <= warn) return COLORS.amber;
    return COLORS.red;
  }
  if (value >= good) return COLORS.teal;
  if (value >= warn) return COLORS.amber;
  return COLORS.red;
}
function metricStatusLabel(color) {
  if (color === COLORS.teal) return "ดี";
  if (color === COLORS.amber) return "เฝ้าระวัง";
  return "ต้องปรับปรุง";
}

function MetricCard({ label, valueText, pct, color, desc, formula }) {
  const [showFormula, setShowFormula] = useState(false);
  return (
    <div className="metric-card">
      <div className="metric-top">
        <div className="metric-label">{label}</div>
        <span className="metric-status" style={{ color, borderColor: color + "55", background: color + "14" }}>{metricStatusLabel(color)}</span>
      </div>
      <div className="metric-value" style={{ color }}>{valueText}</div>
      <div className="progress-track"><div className="progress-fill" style={{ width: `${Math.max(2, Math.min(100, pct))}%`, background: color }} /></div>
      <div className="metric-desc">{desc}</div>
      {formula && (
        <button type="button" className="formula-toggle formula-toggle-inline" onClick={() => setShowFormula((v) => !v)}>
          {showFormula ? "ซ่อนสูตรคำนวณ ▲" : "ดูสูตรคำนวณ ▼"}
        </button>
      )}
      {formula && showFormula && <div className="formula-box">{formula}</div>}
    </div>
  );
}

      </div>
    );
  }
  const k = stats.kpi;

  const pmColor = metricColor(k.pmRatioPct, 60, 40);
  const onTimeColor = metricColor(k.onTimeRatePct, 90, 70);
  const emergColor = metricColor(k.emergencyRatePct, 10, 25, true);

        </div>
        <div className="page-head-actions no-print">
          <button className="btn btn-ghost" onClick={() => window.print()}>พิมพ์ / PDF</button>

      <div className="metric-grid">
        <MetricCard label="อัตราความพร้อมใช้งาน (Availability)" valueText={`${k.availabilityPct.toFixed(1)}%`} pct={k.availabilityPct} color={availColor}
          desc="สัดส่วนเวลาที่เครื่องจักรพร้อมทำงาน เทียบกับเวลาหยุดเครื่องรวมจากการซ่อมบำรุงทั้งหมด"
          formula={`Availability % = ((เวลาพร้อมใช้งานทั้งหมด − เวลาหยุดเครื่องรวม) ÷ เวลาพร้อมใช้งานทั้งหมด) × 100

เวลาพร้อมใช้งานทั้งหมด = ${k.periodDays} วัน × 24 ชม. × ${k.equipCount} อุปกรณ์ = ${k.totalPossibleHours.toFixed(0)} ชม.
เวลาหยุดเครื่องรวม = ${stats.totalDowntime.toFixed(1)} ชม.

= ((${k.totalPossibleHours.toFixed(0)} − ${stats.totalDowntime.toFixed(1)}) ÷ ${k.totalPossibleHours.toFixed(0)}) × 100
= ${k.availabilityPct.toFixed(1)}%`} />
        <MetricCard label="สัดส่วนงานป้องกันเชิงรุก (PM Ratio)" valueText={`${k.pmRatioPct.toFixed(1)}%`} pct={k.pmRatioPct} color={pmColor}
          desc="สัดส่วนงานซ่อมบำรุงเชิงป้องกัน เทียบกับงานซ่อมทั้งหมด ยิ่งสูงยิ่งแสดงถึงการวางแผนที่ดี"
          formula={`PM Ratio % = (จำนวนงานป้องกัน ÷ จำนวนงานทั้งหมด) × 100
= (${k.preventiveCount} ÷ ${k.total}) × 100
= ${k.pmRatioPct.toFixed(1)}%`} />
        <MetricCard label="อัตราซ่อมสำเร็จ (Completion Rate)" valueText={`${k.onTimeRatePct.toFixed(1)}%`} pct={k.onTimeRatePct} color={onTimeColor}
          desc="สัดส่วนงานที่ดำเนินการเสร็จสิ้น เทียบกับงานทั้งหมดที่บันทึกไว้"
          formula={`Completion Rate % = (จำนวนงานที่เสร็จสิ้น ÷ จำนวนงานทั้งหมด) × 100
= (${k.completed} ÷ ${k.total}) × 100
= ${k.onTimeRatePct.toFixed(1)}%`} />
        <MetricCard label="อัตราซ่อมฉุกเฉิน (Emergency Rate)" valueText={`${k.emergencyRatePct.toFixed(1)}%`} pct={k.emergencyRatePct} color={emergColor}
          desc="สัดส่วนงานซ่อมฉุกเฉินที่ไม่ได้วางแผนล่วงหน้า ยิ่งต่ำยิ่งดี"
          formula={`Emergency Rate % = (จำนวนงานฉุกเฉิน ÷ จำนวนงานทั้งหมด) × 100
= (${k.emergency} ÷ ${k.total}) × 100
= ${k.emergencyRatePct.toFixed(1)}%`} />
        <MetricCard label="อัตรางานเกินกำหนด (Overdue Rate)" valueText={`${k.overdueRatePct.toFixed(1)}%`} pct={k.overdueRatePct} color={overdueColor}
          desc="สัดส่วนงานที่เลยกำหนดดำเนินการ ควรควบคุมให้อยู่ในระดับต่ำที่สุด"
          formula={`Overdue Rate % = (จำนวนงานเกินกำหนด ÷ จำนวนงานทั้งหมด) × 100
= (${k.overdue} ÷ ${k.total}) × 100
= ${k.overdueRatePct.toFixed(1)}%`} />
      </div>

      <div className="metric-num-grid">
        <KPI label="MTTR — เวลาซ่อมเฉลี่ย" value={`${k.mttrHours.toFixed(1)} ชม./ครั้ง`} sub="เวลาหยุดเครื่องเฉลี่ยต่องานซ่อม 1 ครั้ง"
          formula={`MTTR = เวลาหยุดเครื่องรวม (ชม.) ÷ จำนวนงานทั้งหมด
= ${stats.totalDowntime.toFixed(1)} ÷ ${k.total}
= ${k.mttrHours.toFixed(2)} ชม./ครั้ง`} />
        <KPI label="MTBF — ระยะห่างการเสียเฉลี่ย" value={k.mtbfDays !== null ? `${k.mtbfDays.toFixed(0)} วัน` : "ข้อมูลไม่พอ"} sub="ระยะเวลาเฉลี่ยระหว่างการเสียแต่ละครั้งต่ออุปกรณ์"
          formula={k.mtbfDays !== null
            ? `MTBF = ค่าเฉลี่ยของ (วันที่เสียครั้งถัดไป − วันที่เสียครั้งก่อนหน้า)
เฉพาะงานแก้ไข/ฉุกเฉินของอุปกรณ์เดียวกันที่เสีย ≥ 2 ครั้ง

= ค่าเฉลี่ยจาก ${k.mtbfSampleCount} ช่วงเวลาที่พบ
= ${k.mtbfDays.toFixed(1)} วัน`
            : `ต้องมีอุปกรณ์ที่มีงานแก้ไข/ฉุกเฉิน อย่างน้อย 2 ครั้ง จึงจะคำนวณระยะห่างการเสียได้`} />
        <KPI label="ต้นทุนเฉลี่ยต่องาน" value={fmtTHB(k.avgCostPerJob)} sub="ค่าใช้จ่ายเฉลี่ยต่องานซ่อมบำรุง 1 ครั้ง"
          formula={`ต้นทุนเฉลี่ยต่องาน = ค่าใช้จ่ายรวม ÷ จำนวนงานทั้งหมด
= ${fmtTHB(stats.totalCost)} ÷ ${k.total}
= ${fmtTHB(k.avgCostPerJob)}`} />
      </div>

      {showLineTable && (
        <div className="panel">
          <div className="panel-title">เปรียบเทียบตัวชี้วัดตามไลน์</div>
          <div className="panel-sub">Completion / PM Ratio / Overdue ของแต่ละไลน์การผลิต</div>
          <div className="line-kpi-table">
            <div className="line-kpi-row line-kpi-head">
              <span>ไลน์</span><span>งาน</span><span>Completion</span><span>PM Ratio</span><span>Overdue</span><span>ค่าใช้จ่าย</span>
            </div>
            {lineStats.map((l) => (
              <div key={l.line} className="line-kpi-row">
                <span className="line-compare-name">{l.line}</span>
                <span>{l.count}</span>
                <span style={{ color: metricColor(l.onTimeRatePct, 90, 70) }}>{l.onTimeRatePct.toFixed(0)}%</span>
                <span style={{ color: metricColor(l.pmRatioPct, 60, 40) }}>{l.pmRatioPct.toFixed(0)}%</span>
                <span style={{ color: metricColor(l.overdueRatePct, 5, 15, true) }}>{l.overdueRatePct.toFixed(0)}%</span>
                <span className="mono">{fmtTHB(l.cost)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

  );
}

function ScheduleForm({ initial, equipmentOptions, lineOptions, defaultLine, onCancel, onSave }) {
  const [form, setForm] = useState(() => ({
    id: (initial && initial.id) || null,
    equipment: (initial && initial.equipment) || "",
    line: (initial && initial.line) || defaultLine || "",
    nextDate: (initial && initial.nextDate) || todayISO(),
    intervalDays: initial && initial.intervalDays !== undefined && initial.intervalDays !== null ? initial.intervalDays : "",
    note: (initial && initial.note) || "",
  }));
  const [error, setError] = useState("");
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.equipment.trim() || !form.nextDate) {
      setError("กรุณาระบุชื่ออุปกรณ์และวันครบกำหนด");
      return;
    }
    onSave({ ...form, intervalDays: form.intervalDays === "" ? null : Number(form.intervalDays) });
  };

  return (
    <form className="panel" onSubmit={submit}>
      <div className="form-grid">
        <div className="field full">
          <label>ชื่ออุปกรณ์ / เครื่องจักร</label>
          <input className="input" list="equip-options" value={form.equipment} onChange={(e) => set("equipment", e.target.value)} placeholder="เลือกหรือพิมพ์ชื่ออุปกรณ์" />
          <datalist id="equip-options">
            {equipmentOptions.map((name) => <option key={name} value={name} />)}
          </datalist>
        </div>
        <div className="field">
          <label>สายการผลิต</label>
          <select className="input" value={form.line} onChange={(e) => set("line", e.target.value)}>
            <option value="">ไม่ระบุ (แสดงทุกไลน์)</option>
            {lineOptions.map((l) => <option key={l} value={l}>{l}</option>)}
          </select>
        </div>
        <div className="field">
          <label>วันครบกำหนดถัดไป</label>
          <input className="input" type="date" value={form.nextDate} onChange={(e) => set("nextDate", e.target.value)} />
        </div>
        <div className="field">
          <label>รอบซ้ำ (วัน) — เว้นว่างถ้าไม่ซ้ำ</label>
          <input className="input" type="number" min="1" value={form.intervalDays} onChange={(e) => set("intervalDays", e.target.value)} placeholder="เช่น 30" />
        </div>
        <div className="field full">
          <label>รายละเอียดการแจ้งเตือน</label>
          <textarea className="input" value={form.note} onChange={(e) => set("note", e.target.value)} placeholder="สิ่งที่ต้องตรวจสอบหรือดำเนินการ" />
        </div>
      </div>
      {error && <div style={{ color: COLORS.red, fontSize: 12.5, marginTop: 12 }}>{error}</div>}
      <div className="form-actions">
        <button type="button" className="btn btn-ghost" onClick={onCancel}>ยกเลิก</button>
        <button type="submit" className="btn">บันทึกการแจ้งเตือน</button>
      </div>
    </form>
  );
}

function AlertsPage({ alerts, records, lineOptions, defaultLine, onCompleteSchedule, onDeleteSchedule, onSaveSchedule, onGoToRecord }) {
  const [showForm, setShowForm] = useState(false);
  const [editingSchedule, setEditingSchedule] = useState(null);


  if (!alerts) return <div className="loading-wrap">กำลังโหลดข้อมูล…</div>;

  const equipmentOptions = Array.from(new Set((records || []).map((r) => r.equipment)));
  const totalAlerts = alerts.overdueRecords.length + alerts.overdueSchedules.length + alerts.dueSoonSchedules.length;

  const openNew = () => { setEditingSchedule({}); setShowForm(true); };
  const openEdit = (s) => { setEditingSchedule(s); setShowForm(true); };
  const closeForm = () => { setShowForm(false); setEditingSchedule(null); };
  const handleSave = (sc) => { onSaveSchedule(sc); closeForm(); };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">แจ้งเตือนซ่อมบำรุง</div>
          <div className="page-desc">{totalAlerts > 0 ? `มี ${totalAlerts} รายการที่ต้องติดตาม` : "ไม่มีรายการที่ต้องติดตามด่วนในขณะนี้"}</div>
        </div>
        {!showForm && <button className="btn" onClick={openNew}>+ ตั้งการแจ้งเตือนใหม่</button>}
      </div>

      {showForm && (
        <ScheduleForm initial={editingSchedule} equipmentOptions={equipmentOptions} lineOptions={lineOptions} defaultLine={defaultLine} onCancel={closeForm} onSave={handleSave} />
      )}

      <div className="alert-section-title">งานซ่อมที่เกินกำหนด</div>
      {alerts.overdueRecords.length === 0 ? (
        <div className="alert-empty">ไม่มีงานซ่อมที่เกินกำหนดในขณะนี้</div>
      ) : (
        <div className="alert-list">
          {alerts.overdueRecords.map((r) => (
            <div key={r.id} className="alert-item">
              <div className="alert-main">
                <div className="alert-title">{r.equipment}{r.line && <span className="alert-line-tag">{r.line}</span>}</div>
                <div className="alert-sub">{r.note || TYPE_META[r.type].label} · ช่าง {r.technician}</div>
              </div>
              <div className="alert-days mono" style={{ color: COLORS.red }}>{fmtDateTH(r.date)}</div>
              <button className="icon-btn" onClick={() => onGoToRecord(r)}>เปิดดู</button>
            </div>
          ))}
        </div>
      )}

      <div className="alert-section-title">ครบกำหนดแล้ว (จากรอบแจ้งเตือน)</div>
      {alerts.overdueSchedules.length === 0 ? (
        <div className="alert-empty">ไม่มีรอบแจ้งเตือนที่เลยกำหนด</div>
      ) : (
        <div className="alert-list">
          {alerts.overdueSchedules.map((s) => (
            <div key={s.id} className="alert-item">
              <div className="alert-main">
                <div className="alert-title">{s.equipment}{s.line && <span className="alert-line-tag">{s.line}</span>}</div>
                <div className="alert-sub">{s.note || "ถึงรอบตรวจสอบ/ซ่อมบำรุง"}</div>
              </div>
              <div className="alert-days mono" style={{ color: COLORS.red }}>เลยกำหนด {Math.abs(s.daysLeft)} วัน</div>
              <div className="row-actions" style={{ opacity: 1 }}>
                <button className="icon-btn" onClick={() => onCompleteSchedule(s)}>เสร็จแล้ว</button>
                <button className="icon-btn" onClick={() => openEdit(s)}>แก้ไข</button>
                <button className="icon-btn" onClick={() => onDeleteSchedule(s.id)}>ลบ</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="alert-section-title">ใกล้ถึงกำหนด (ภายใน 7 วัน)</div>
      {alerts.dueSoonSchedules.length === 0 ? (
        <div className="alert-empty">ไม่มีรอบแจ้งเตือนที่ใกล้ถึงกำหนด</div>
      ) : (
        <div className="alert-list">
          {alerts.dueSoonSchedules.map((s) => (
            <div key={s.id} className="alert-item warn">
              <div className="alert-main">
                <div className="alert-title">{s.equipment}{s.line && <span className="alert-line-tag">{s.line}</span>}</div>
                <div className="alert-sub">{s.note || "ถึงรอบตรวจสอบ/ซ่อมบำรุง"}</div>
              </div>
              <div className="alert-days mono" style={{ color: COLORS.amber }}>{s.daysLeft === 0 ? "วันนี้" : `อีก ${s.daysLeft} วัน`}</div>
              <div className="row-actions" style={{ opacity: 1 }}>
                <button className="icon-btn" onClick={() => onCompleteSchedule(s)}>เสร็จแล้ว</button>
                <button className="icon-btn" onClick={() => openEdit(s)}>แก้ไข</button>
                <button className="icon-btn" onClick={() => onDeleteSchedule(s.id)}>ลบ</button>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="alert-section-title">กำหนดการถัดไป</div>
      {alerts.upcomingSchedules.length === 0 ? (
        <div className="alert-empty">ยังไม่มีรอบแจ้งเตือนอื่นที่ตั้งไว้</div>
      ) : (
        <div className="alert-list">
          {alerts.upcomingSchedules.map((s) => (
            <div key={s.id} className="alert-item ok">
              <div className="alert-main">
                <div className="alert-title">{s.equipment}{s.line && <span className="alert-line-tag">{s.line}</span>}</div>
                <div className="alert-sub">{s.note || "ถึงรอบตรวจสอบ/ซ่อมบำรุง"}</div>
              </div>
              <div className="alert-days mono" style={{ color: COLORS.teal }}>{fmtDateTH(s.nextDate)}</div>
              <div className="row-actions" style={{ opacity: 1 }}>
                <button className="icon-btn" onClick={() => openEdit(s)}>แก้ไข</button>
                <button className="icon-btn" onClick={() => onDeleteSchedule(s.id)}>ลบ</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Records({ filtered, query, setQuery, filterType, setFilterType, filterStatus, setFilterStatus, onEdit, onDelete, onNew, total, selectedLine }) {
  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">รายการซ่อมบำรุง</div>
          <div className="page-desc">
            {selectedLine === "all" ? "ทุกไลน์" : selectedLine} · ทั้งหมด {total} รายการ · แสดง {filtered.length} รายการ
          </div>
        </div>
        <div className="page-head-actions no-print">
          <button className="btn btn-ghost" onClick={() => exportRecordsCSV(filtered, selectedLine)} disabled={filtered.length === 0}>ส่งออก CSV</button>
          <button className="btn btn-ghost" onClick={() => window.print()}>พิมพ์ / PDF</button>
          <button className="btn" onClick={onNew}>+ บันทึกรายการใหม่</button>
        </div>
      </div>

      <div className="toolbar">
        <input className="input search" placeholder="ค้นหาอุปกรณ์, ช่าง, รายละเอียด…" value={query} onChange={(e) => setQuery(e.target.value)} />
        <select className="input" value={filterType} onChange={(e) => setFilterType(e.target.value)}>
          <option value="all">ทุกประเภท</option>
          {Object.entries(TYPE_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <select className="input" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
          <option value="all">ทุกสถานะ</option>
          {Object.entries(STATUS_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
      </div>

      {filtered.length === 0 ? (
        <div className="empty">
          <div className="headline">ไม่พบรายการ</div>
          <div>ลองปรับคำค้นหาหรือตัวกรองใหม่</div>
        </div>
      ) : (
        <div className="panel" style={{ padding: 0, overflowX: "auto" }}>
          <table>
            <thead>
              <tr>
                <th>อุปกรณ์</th><th>ไลน์</th><th>ประเภท</th><th>วันที่</th><th>ช่างซ่อม</th>
                <th>ค่าใช้จ่าย</th><th>หยุดเครื่อง</th><th>ความสำคัญ</th><th>สถานะ</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((r) => (
                <tr key={r.id}>
                  <td>
                    <div className="equip-name">{r.equipment}</div>
                    {r.note && <div className="equip-note">{r.note}</div>}
                  </td>
                  <td>{r.line || "—"}</td>
                  <td><Tag meta={TYPE_META[r.type]} /></td>
                  <td className="mono">{r.date}</td>
                  <td>{r.technician}</td>
                  <td className="mono">{fmtTHB(r.cost)}</td>
                  <td className="mono">{Number(r.downtime).toFixed(1)} ชม.</td>
                  <td><Tag meta={PRIORITY_META[r.priority]} /></td>
                  <td><Tag meta={STATUS_META[r.status]} /></td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" onClick={() => onEdit(r)}>แก้ไข</button>
                      <button className="icon-btn" onClick={() => onDelete(r.id)}>ลบ</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function RecordForm({ initial, lineOptions, defaultLine, onCancel, onSave }) {
  const isEdit = !!(initial && initial.id);
  const [form, setForm] = useState(() => ({
    id: initial && initial.id || null,
    equipment: (initial && initial.equipment) || "",
    line: (initial && initial.line) || defaultLine || "",
    type: (initial && initial.type) || "preventive",
    date: (initial && initial.date) || todayISO(),
    technician: (initial && initial.technician) || "",
    cost: initial && initial.cost !== undefined ? initial.cost : "",
    downtime: initial && initial.downtime !== undefined ? initial.downtime : "",
    priority: (initial && initial.priority) || "medium",
    status: (initial && initial.status) || "completed",
    note: (initial && initial.note) || "",
  }));
  const [error, setError] = useState("");

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.equipment.trim() || !form.technician.trim() || !form.date || !form.line.trim()) {
      setError("กรุณากรอกชื่ออุปกรณ์ สายการผลิต ช่างซ่อม และวันที่ให้ครบถ้วน");
      return;
    }
    onSave({ ...form, cost: Number(form.cost) || 0, downtime: Number(form.downtime) || 0 });
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-title">{isEdit ? "แก้ไขรายการซ่อมบำรุง" : "บันทึกรายการใหม่"}</div>
          <div className="page-desc">กรอกรายละเอียดงานซ่อมบำรุงให้ครบถ้วนเพื่อให้ข้อมูลวิเคราะห์แม่นยำ</div>
        </div>
      </div>

      <form className="panel" onSubmit={submit}>
        <div className="form-grid">
          <div className="field full">
            <label>ชื่ออุปกรณ์ / เครื่องจักร</label>
            <input className="input" value={form.equipment} onChange={(e) => set("equipment", e.target.value)} placeholder="เช่น คอมเพรสเซอร์ #1" />
          </div>

          <div className="field">
            <label>สายการผลิต</label>
            <input className="input" list="line-options" value={form.line} onChange={(e) => set("line", e.target.value)} placeholder="เลือกหรือพิมพ์ชื่อไลน์" />
            <datalist id="line-options">
              {lineOptions.map((l) => <option key={l} value={l} />)}
            </datalist>
          </div>
          <div className="field">
            <label>ประเภทงาน</label>
            <select className="input" value={form.type} onChange={(e) => set("type", e.target.value)}>
              {Object.entries(TYPE_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div className="field">
            <label>วันที่ดำเนินการ</label>
            <input className="input" type="date" value={form.date} onChange={(e) => set("date", e.target.value)} />
          </div>

          <div className="field">
            <label>ช่างผู้รับผิดชอบ</label>
            <input className="input" value={form.technician} onChange={(e) => set("technician", e.target.value)} placeholder="ชื่อช่างซ่อม" />
          </div>
          <div className="field">
            <label>ความสำคัญ</label>
            <select className="input" value={form.priority} onChange={(e) => set("priority", e.target.value)}>
              {Object.entries(PRIORITY_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>

          <div className="field">
            <label>ค่าใช้จ่าย (บาท)</label>
            <input className="input" type="number" min="0" step="1" value={form.cost} onChange={(e) => set("cost", e.target.value)} placeholder="0" />
          </div>
          <div className="field">
            <label>เวลาหยุดเครื่อง (ชั่วโมง)</label>
            <input className="input" type="number" min="0" step="0.5" value={form.downtime} onChange={(e) => set("downtime", e.target.value)} placeholder="0" />
          </div>

          <div className="field">
            <label>สถานะ</label>
            <select className="input" value={form.status} onChange={(e) => set("status", e.target.value)}>
              {Object.entries(STATUS_META).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
            </select>
          </div>
          <div />

          <div className="field full">
            <label>รายละเอียด / บันทึกเพิ่มเติม</label>
            <textarea className="input" value={form.note} onChange={(e) => set("note", e.target.value)} placeholder="อาการ, อะไหล่ที่เปลี่ยน, หมายเหตุ…" />
          </div>
        </div>

        {error && <div style={{ color: COLORS.red, fontSize: 12.5, marginTop: 12 }}>{error}</div>}

        <div className="form-actions">
          <button type="button" className="btn btn-ghost" onClick={onCancel}>ยกเลิก</button>
          <button type="submit" className="btn">{isEdit ? "บันทึกการแก้ไข" : "บันทึกรายการ"}</button>
        </div>
      </form>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
